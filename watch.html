<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MEDIA_ARCHIVE ♡ WATCH</title>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {

    --bg: #08070d;
    --bg2: #0e0a14;
    --panel: #15101c;
    --panel2: #1d1423;

    --pink: #ffb7d5;
    --hotpink: #ff4f91;
    --purple: #d9b7ff;
    --yellow: #fff0a6;
    --green: #b8ff68;
    --red: #ff4269;

    --white: #fff8fc;
    --muted: #a99caf;

    --border: rgba(255,183,213,.20);

}


/* =========================================================
   RESET
========================================================= */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


html {

    scroll-behavior: smooth;

}


body {

    min-height: 100vh;

    background-color: var(--bg);

    background-image:

        radial-gradient(
            circle at 10% 5%,
            rgba(255,79,145,.11),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 25%,
            rgba(217,183,255,.08),
            transparent 28%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(184,255,104,.045),
            transparent 35%
        ),

        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.012) 0px,
            rgba(255,255,255,.012) 1px,
            transparent 1px,
            transparent 4px
        );

    color: var(--white);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    overflow-x: hidden;

}


body::after {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 9999;

    background:

        radial-gradient(
            ellipse at center,
            transparent 50%,
            rgba(0,0,0,.42) 100%
        );

}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    width: min(
        1050px,
        calc(100% - 28px)
    );

    margin: auto;

    position: relative;

    z-index: 5;

    padding-bottom: 100px;

}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-area {

    padding-top: 18px;

    padding-bottom: 14px;

}


.back-btn {

    border:
        1px solid
        rgba(255,183,213,.20);

    background:
        rgba(255,183,213,.06);

    color: var(--pink);

    border-radius: 9px;

    padding:
        9px
        13px;

    font-family: monospace;

    font-size: 10px;

    cursor: pointer;

    transition: .2s;

}


.back-btn:hover {

    background: var(--pink);

    color: #120b12;

}


/* =========================================================
   VIDEO PANEL
========================================================= */

.video-panel {

    background:

        linear-gradient(
            145deg,
            rgba(31,20,36,.96),
            rgba(12,9,16,.96)
        );

    border:
        1px solid
        var(--border);

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 18px 50px rgba(0,0,0,.55);

}


/* =========================================================
   VIDEO
========================================================= */

.video-container {

    width: 100%;

    background: #000;

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    min-height: 250px;

}


/*
   The iframe inserted here is the ORIGINAL iframe
   stored in Firestore.

   We don't modify its URL.
*/

.video-container iframe {

    width: 100%;

    max-width: 100%;

    aspect-ratio: 16 / 9;

    min-height: 300px;

    border: 0;

    display: block;

}


/* =========================================================
   VIDEO LOADING
========================================================= */

.video-loading {

    padding: 80px 20px;

    text-align: center;

    color: var(--muted);

    font-family: monospace;

    font-size: 10px;

}


.loading-face {

    font-size: 26px;

    margin-bottom: 12px;

}


/* =========================================================
   VIDEO INFORMATION
========================================================= */

.video-info {

    padding: 20px;

}


.video-title {

    color: var(--pink);

    font-size: 20px;

    font-weight: 800;

    line-height: 1.35;

}


.video-title::before {

    content: "♡ ";

    color: var(--purple);

}


.video-meta {

    margin-top: 8px;

    color: #766b7b;

    font-family: monospace;

    font-size: 9px;

}


/* =========================================================
   ACTIONS
========================================================= */

.actions {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 17px;

}


.action-btn {

    border:
        1px solid
        rgba(255,183,213,.18);

    background:
        rgba(255,255,255,.035);

    color: #cfc5d1;

    border-radius: 9px;

    padding:
        9px
        12px;

    font-family: monospace;

    font-size: 10px;

    cursor: pointer;

    transition: .2s;

}


.action-btn:hover {

    color: var(--pink);

    border-color: var(--pink);

    transform: translateY(-1px);

}


.action-btn.active-like {

    color: var(--green);

    border-color:
        rgba(184,255,104,.4);

    background:
        rgba(184,255,104,.06);

}


.action-btn.active-dislike {

    color: var(--red);

    border-color:
        rgba(255,66,105,.4);

    background:
        rgba(255,66,105,.06);

}


/* =========================================================
   COMMENTS PANEL
========================================================= */

.comments-panel {

    margin-top: 20px;

    background:

        linear-gradient(
            145deg,
            rgba(31,20,36,.96),
            rgba(12,9,16,.96)
        );

    border:
        1px solid
        var(--border);

    border-radius: 18px;

    padding: 20px;

    box-shadow:
        0 18px 45px rgba(0,0,0,.45);

}


.comments-title {

    color: var(--pink);

    font-size: 14px;

    font-weight: 900;

    letter-spacing: 1px;

}


.comments-subtitle {

    margin-top: 5px;

    color: #756a79;

    font-family: monospace;

    font-size: 8px;

}


/* =========================================================
   COMMENT FORM
========================================================= */

.comment-form {

    margin-top: 18px;

}


.comment-input {

    width: 100%;

    min-height: 85px;

    resize: vertical;

    padding: 12px;

    border-radius: 10px;

    border:
        1px solid
        rgba(255,183,213,.18);

    background: #0b0810;

    color: white;

    outline: none;

    font-family: monospace;

    font-size: 11px;

}


.comment-input:focus {

    border-color: var(--pink);

    box-shadow:
        0 0 18px
        rgba(255,183,213,.08);

}


.comment-name {

    margin-top: 8px;

    width: 100%;

    padding: 10px 12px;

    border-radius: 10px;

    border:
        1px solid
        rgba(255,183,213,.18);

    background: #0b0810;

    color: white;

    outline: none;

    font-family: monospace;

    font-size: 10px;

}


.comment-name:focus {

    border-color: var(--pink);

}


.comment-submit {

    margin-top: 8px;

    border:
        1px solid
        rgba(255,183,213,.22);

    background:
        rgba(255,183,213,.07);

    color: var(--pink);

    border-radius: 9px;

    padding:
        9px
        13px;

    font-family: monospace;

    font-size: 9px;

    cursor: pointer;

}


.comment-submit:hover {

    background: var(--pink);

    color: #120b12;

}


/* =========================================================
   COMMENTS LIST
========================================================= */

.comments-list {

    margin-top: 24px;

    display: flex;

    flex-direction: column;

    gap: 10px;

}


.comment {

    background:
        rgba(255,255,255,.025);

    border:
        1px solid
        rgba(255,183,213,.10);

    border-radius: 11px;

    padding: 12px;

}


.comment-top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

}


.comment-user {

    color: var(--purple);

    font-family: monospace;

    font-size: 9px;

    font-weight: 800;

}


.comment-date {

    color: #665c6c;

    font-family: monospace;

    font-size: 7px;

}


.comment-text {

    margin-top: 8px;

    color: #ddd4df;

    font-size: 11px;

    line-height: 1.55;

    white-space: pre-wrap;

    word-break: break-word;

}


.comment-actions {

    margin-top: 9px;

    display: flex;

    gap: 6px;

}


.comment-delete {

    border:
        1px solid
        rgba(255,66,105,.25);

    background:
        rgba(255,66,105,.04);

    color: var(--red);

    border-radius: 7px;

    padding:
        5px
        8px;

    font-family: monospace;

    font-size: 8px;

    cursor: pointer;

}


.comment-delete:hover {

    background: var(--red);

    color: white;

}


.no-comments {

    padding: 40px 10px;

    text-align: center;

    color: #756a79;

    font-family: monospace;

    font-size: 9px;

}


/* =========================================================
   FOOTER
========================================================= */

footer {

    margin-top: 45px;

    text-align: center;

    color: #5d5363;

    font-family: monospace;

    font-size: 8px;

    line-height: 2.2;

}


footer strong {

    color: var(--pink);

    font-size: 11px;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:650px) {

    .container {

        width:
            calc(100% - 16px);

    }

    .back-area {

        padding-top: 10px;

    }

    .video-title {

        font-size: 17px;

    }

    .video-container iframe {

        min-height: 220px;

    }

    .video-info {

        padding: 16px;

    }

    .comments-panel {

        padding: 16px;

    }

}


/* =========================================================
   SHARE MESSAGE
========================================================= */

.share-message {

    position: fixed;

    left: 50%;

    bottom: 25px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:
        #1d1423;

    border:
        1px solid
        rgba(255,183,213,.25);

    color: var(--pink);

    padding:
        10px
        14px;

    border-radius: 9px;

    font-family: monospace;

    font-size: 9px;

    opacity: 0;

    pointer-events: none;

    transition: .25s;

    z-index: 20000;

}


.share-message.show {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);

}

</style>

</head>


<body>


<div class="container">

    id="shareMessage"
    class="share-message"
>
    ♡ link copied
</div>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyB_rZQ0-PTcw2u--0AjybOBtWnoh2xDk",

    authDomain:
        "counter-ea7c8.firebaseapp.com",

    projectId:
        "counter-ea7c8",

    storageBucket:
        "counter-ea7c8.firebasestorage.app",

    messagingSenderId:
        "976604631332",

    appId:
        "1:976604631332:web:fc0929d3231ac63a67a3b1"

};


firebase.initializeApp(firebaseConfig);


const db =
    firebase.firestore();


/* =========================================================
   ADMIN
========================================================= */

let isAdmin = false;

const ADMIN_USERNAME = "tanishq";

const ADMIN_PASSWORD = "ssssss";


/* =========================================================
   VIDEO ID
========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const videoId =
    urlParams.get("id");


let currentVideo = null;


/* =========================================================
   SIMPLE USER ID
========================================================= */

/*
   We don't use Firebase Authentication for now.

   A random ID is stored in localStorage.

   This lets the same browser recognize
   which comments belong to the current user.
*/

let currentUserId =
    localStorage.getItem(
        "mediaArchiveUserId"
    );


if (!currentUserId) {

    currentUserId =
        "user_" +
        Math.random()
            .toString(36)
            .substring(2, 12) +
        "_" +
        Date.now();

    localStorage.setItem(
        "mediaArchiveUserId",
        currentUserId
    );

}


/* =========================================================
   REACTION USER ID
========================================================= */

let reactionUserId =
    localStorage.getItem(
        "mediaArchiveReactionId"
    );


if (!reactionUserId) {

    reactionUserId =
        "reaction_" +
        Math.random()
            .toString(36)
            .substring(2, 14) +
        "_" +
        Date.now();

    localStorage.setItem(
        "mediaArchiveReactionId",
        reactionUserId
    );

}


/* =========================================================
   LOAD VIDEO
========================================================= */

if (!videoId) {

    showError(
        "No video ID was provided."
    );

}

else {

    loadVideo();

}


/* =========================================================
   LOAD VIDEO
========================================================= */

async function loadVideo() {

    try {

        const doc =
            await db
                .collection("videos")
                .doc(videoId)
                .get();


        if (!doc.exists) {

            showError(
                "Tape not found in the archive."
            );

            return;

        }


        currentVideo = {

            id: doc.id,

            ...doc.data()

        };


        document.title =
            "MEDIA_ARCHIVE ♡ " +
            (
                currentVideo.title ||
                "WATCH"
            );


        document.getElementById(
            "videoTitle"
        ).textContent =
            currentVideo.title ||
            "untitled tape";


        document.getElementById(
            "videoMeta"
        ).textContent =
            "MEDIA_ARCHIVE // TAPE_" +
            videoId;


        /*
           IMPORTANT:

           We use the original rawInput.

           We do NOT add:
           - privacy settings
           - title settings
           - warning settings
           - autoplay
           - query parameters

           The embed remains exactly as saved.
        */

        loadOriginalEmbed(
            currentVideo.rawInput
        );


        loadReactionCounts();


        loadComments();

    }

    catch(error) {

        console.error(
            "VIDEO LOAD ERROR:",
            error
        );

        showError(
            "Could not load this tape.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   ORIGINAL EMBED
========================================================= */

function loadOriginalEmbed(
    rawInput
) {

    const container =
        document.getElementById(
            "videoContainer"
        );


    if (!rawInput) {

        showError(
            "This tape has no embed code."
        );

        return;

    }


    /*
       If rawInput is an iframe,
       extract the iframe HTML itself.

       We intentionally don't modify
       its src or query parameters.
    */

    const iframeMatch =
        rawInput.match(
            /<iframe[\s\S]*?<\/iframe>/i
        );


    if (iframeMatch) {

        container.innerHTML =
            iframeMatch[0];

        return;

    }


    /*
       If only a URL was saved,
       create a basic iframe.

       This is only the fallback.
    */

    const trimmed =
        rawInput.trim();


    if (
        trimmed.startsWith(
            "https://"
        ) ||
        trimmed.startsWith(
            "http://"
        )
    ) {

        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.src =
            trimmed;


        iframe.allow =
            "fullscreen";


        iframe.style.border =
            "0";


        iframe.setAttribute(
            "allowfullscreen",
            ""
        );


        container.innerHTML = "";


        container.appendChild(
            iframe
        );


        return;

    }


    showError(
        "Invalid embed code."
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
) {

    document.getElementById(
        "videoContainer"
    ).innerHTML = `

        <div class="video-loading">

            <div class="loading-face">
                (⁠;⁠_⁠;⁠)
            </div>

            ${escapeHTML(message)}

        </div>

    `;

}


/* =========================================================
   BACK
========================================================= */

function goBack() {

    window.location.href =
        "archive.html";

}


/* =========================================================
   REACTION DOCUMENT ID
========================================================= */

function reactionDocId() {

    return (
        videoId +
        "_" +
        reactionUserId
    );

}


/* =========================================================
   LIKE VIDEO
========================================================= */

async function likeVideo() {

    if (!videoId) {
        return;
    }


    const ref =
        db
            .collection("videoReactions")
            .doc(
                reactionDocId()
            );


    try {

        const existing =
            await ref.get();


        if (
            existing.exists &&
            existing.data().reaction ===
                "like"
        ) {

            await ref.delete();

        }

        else {

            await ref.set({

                videoId:
                    videoId,

                userId:
                    reactionUserId,

                reaction:
                    "like",

                updatedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });

        }


        loadReactionCounts();

    }

    catch(error) {

        console.error(
            "LIKE ERROR:",
            error
        );

        alert(
            "Could not like this video:\n" +
            error.message
        );

    }

}


/* =========================================================
   DISLIKE VIDEO
========================================================= */

async function dislikeVideo() {

    if (!videoId) {
        return;
    }


    const ref =
        db
            .collection("videoReactions")
            .doc(
                reactionDocId()
            );


    try {

        const existing =
            await ref.get();


        if (
            existing.exists &&
            existing.data().reaction ===
                "dislike"
        ) {

            await ref.delete();

        }

        else {

            await ref.set({

                videoId:
                    videoId,

                userId:
                    reactionUserId,

                reaction:
                    "dislike",

                updatedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });

        }


        loadReactionCounts();

    }

    catch(error) {

        console.error(
            "DISLIKE ERROR:",
            error
        );

        alert(
            "Could not dislike this video:\n" +
            error.message
        );

    }

}


/* =========================================================
   LOAD REACTION COUNTS
========================================================= */

async function loadReactionCounts() {

    try {

        const snapshot =
            await db
                .collection(
                    "videoReactions"
                )
                .where(
                    "videoId",
                    "==",
                    videoId
                )
                .get();


        let likes = 0;

        let dislikes = 0;

        let myReaction = null;


        snapshot.forEach(
            doc => {

                const data =
                    doc.data();


                if (
                    data.reaction ===
                    "like"
                ) {

                    likes++;

                }


                if (
                    data.reaction ===
                    "dislike"
                ) {

                    dislikes++;

                }


                if (
                    data.userId ===
                    reactionUserId
                ) {

                    myReaction =
                        data.reaction;

                }

            }
        );


        document.getElementById(
            "likeCount"
        ).textContent =
            likes;


        document.getElementById(
            "dislikeCount"
        ).textContent =
            dislikes;


        const likeButton =
            document.getElementById(
                "likeButton"
            );


        const dislikeButton =
            document.getElementById(
                "dislikeButton"
            );


        likeButton.classList.toggle(
            "active-like",
            myReaction === "like"
        );


        dislikeButton.classList.toggle(
            "active-dislike",
            myReaction === "dislike"
        );

    }

    catch(error) {

        console.error(
            "REACTION LOAD ERROR:",
            error
        );

    }

}


/* =========================================================
   SHARE
========================================================= */

async function shareVideo() {

    const shareURL =
        window.location.href;


    try {

        if (
            navigator.share
        ) {

            await navigator.share({

                title:
                    currentVideo?.title ||
                    "MEDIA_ARCHIVE",

                url:
                    shareURL

            });

            return;

        }


        await navigator.clipboard.writeText(
            shareURL
        );


        showShareMessage(
            "♡ link copied"
        );

    }

    catch(error) {

        /*
           User cancelled native share.
           Don't show an error.
        */

        if (
            error &&
            error.name ===
                "AbortError"
        ) {

            return;

        }


        try {

            await navigator.clipboard.writeText(
                shareURL
            );

            showShareMessage(
                "♡ link copied"
            );

        }

        catch(copyError) {

            prompt(
                "Copy this link:",
                shareURL
            );

        }

    }

}


/* =========================================================
   SHARE MESSAGE
========================================================= */

function showShareMessage(
    text
) {

    const message =
        document.getElementById(
            "shareMessage"
        );


    message.textContent =
        text;


    message.classList.add(
        "show"
    );


    setTimeout(
        () => {

            message.classList.remove(
                "show"
            );

        },
        2000
    );

}


/* =========================================================
   ADD COMMENT
========================================================= */

async function addComment() {

    if (!videoId) {
        return;
    }


    const text =
        document.getElementById(
            "commentInput"
        ).value.trim();


    const username =
        document.getElementById(
            "commentName"
        ).value.trim();


    if (!username) {

        alert(
            "Please enter your name."
        );

        return;

    }


    if (!text) {

        alert(
            "Please write a comment."
        );

        return;

    }


    if (text.length > 1000) {

        alert(
            "Comment is too long."
        );

        return;

    }


    try {

        await db
            .collection("comments")
            .add({

                videoId:
                    videoId,

                text:
                    text,

                username:
                    username,

                userId:
                    currentUserId,

                createdAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            });


        document.getElementById(
            "commentInput"
        ).value = "";


        showShareMessage(
            "♡ comment posted"
        );

    }

    catch(error) {

        console.error(
            "COMMENT ERROR:",
            error
        );

        alert(
            "Could not post comment:\n" +
            error.message
        );

    }

}


/* =========================================================
   LOAD COMMENTS
========================================================= */

function loadComments() {

    db
        .collection("comments")
        .where(
            "videoId",
            "==",
            videoId
        )
        .onSnapshot(

            snapshot => {

                const comments =
                    snapshot.docs.map(
                        doc => ({

                            id:
                                doc.id,

                            ...doc.data()

                        })
                    );


                comments.sort(
                    (
                        a,
                        b
                    ) => {

                        const aTime =
                            a.createdAt &&
                            a.createdAt.toMillis
                                ? a.createdAt.toMillis()
                                : 0;


                        const bTime =
                            b.createdAt &&
                            b.createdAt.toMillis
                                ? b.createdAt.toMillis()
                                : 0;


                        return (
                            bTime -
                            aTime
                        );

                    }
                );


                renderComments(
                    comments
                );

            },

            error => {

                console.error(
                    "COMMENTS ERROR:",
                    error
                );


                document.getElementById(
                    "commentsList"
                ).innerHTML = `

                    <div class="no-comments">

                        Comments unavailable.

                        <br><br>

                        ${escapeHTML(
                            error.message
                        )}

                    </div>

                `;

            }

        );

}


/* =========================================================
   RENDER COMMENTS
========================================================= */

function renderComments(
    comments
) {

    const list =
        document.getElementById(
            "commentsList"
        );


    if (!comments.length) {

        list.innerHTML = `

            <div class="no-comments">

                (⁠｡⁠•́⁠︿⁠•̀⁠｡⁠)

                <br><br>

                no comments yet...

            </div>

        `;

        return;

    }


    list.innerHTML =
        comments
            .map(
                comment => {

                    const canDelete =
                        isAdmin ||
                        comment.userId ===
                            currentUserId;


                    return `

                        <div
                            class="comment"
                            id="comment-${escapeHTML(
                                comment.id
                            )}"
                        >

                            <div class="comment-top">

                                <div class="comment-user">

                                    ♡ ${escapeHTML(
                                        comment.username ||
                                        "anonymous"
                                    )}

                                </div>


                                <div class="comment-date">

                                    ${formatDate(
                                        comment.createdAt
                                    )}

                                </div>

                            </div>


                            <div class="comment-text">

                                ${escapeHTML(
                                    comment.text ||
                                    ""
                                )}

                            </div>


                            ${
                                canDelete
                                    ?
                                `

                                    <div class="comment-actions">

                                        <button
                                            class="comment-delete"
                                            onclick="deleteComment('${escapeJS(
                                                comment.id
                                            )}')"
                                        >
                                            ✕ DELETE
                                        </button>

                                    </div>

                                `
                                    :
                                ""
                            }

                        </div>

                    `;

                }
            )
            .join("");

}


/* =========================================================
   DELETE COMMENT
========================================================= */

async function deleteComment(
    commentId
) {

    try {

        const commentRef =
            db
                .collection("comments")
                .doc(commentId);


        const commentDoc =
            await commentRef.get();


        if (!commentDoc.exists) {

            return;

        }


        const comment =
            commentDoc.data();


        /*
           Admin can delete anything.

           Normal user can only delete
           comments belonging to their
           local user ID.
        */

        if (
            !isAdmin &&
            comment.userId !==
                currentUserId
        ) {

            alert(
                "You can only delete your own comments."
            );

            return;

        }


        const confirmed =
            confirm(
                "Are you sure you want to delete this comment?"
            );


        if (!confirmed) {

            return;

        }


        await commentRef.delete();


        showShareMessage(
            "♡ comment deleted"
        );

    }

    catch(error) {

        console.error(
            "DELETE COMMENT ERROR:",
            error
        );

        alert(
            "Could not delete comment:\n" +
            error.message
        );

    }

}


/* =========================================================
   SIMPLE ADMIN LOGIN
========================================================= */

/*
   For now this is intentionally simple
   and matches archive.html.

   Add ?admin=login to the URL to expose
   the small admin prompt.

   Example:

   watch.html?id=VIDEO_ID&admin=login
*/


const adminParameter =
    urlParams.get("admin");


if (
    adminParameter === "login"
) {

    const username =
        prompt(
            "ADMIN USERNAME"
        );


    const password =
        prompt(
            "ADMIN PASSWORD"
        );


    if (
        username ===
            ADMIN_USERNAME &&
        password ===
            ADMIN_PASSWORD
    ) {

        isAdmin = true;

        loadComments();

    }

}


/* =========================================================
   FORMAT DATE
========================================================= */

function formatDate(
    timestamp
) {

    if (
        !timestamp ||
        !timestamp.toDate
    ) {

        return "just now";

    }


    const date =
        timestamp.toDate();


    return date.toLocaleString();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
    value
) {

    return String(
        value
    ).replace(
        /[&<>"']/g,
        character => ({

            "&":
                "&amp;",

            "<":
                "&lt;",

            ">":
                "&gt;",

            '"':
                "&quot;",

            "'":
                "&#039;"

        }[character])
    );

}


/* =========================================================
   ESCAPE JS
========================================================= */

function escapeJS(
    value
) {

    return String(
        value
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\n/g,
            "\\n"
        )
        .replace(
            /\r/g,
            "\\r"
        );

}
