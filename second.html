function formatTitle(slug) {
    if (!slug) return "Untitled Video";
    let title = slug;
    try { title = decodeURIComponent(title); } catch (_) {}
    return title.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim().toLowerCase()
        .split(" ").map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : "").join(" ") || "Untitled Video";
}

function cleanUrl(rawUrl) {
    let url = String(rawUrl || "").trim();
    if (url.length >= 2 && ((url.startsWith('"') && url.endsWith('"')) || (url.startsWith("'") && url.endsWith("'")))) {
        url = url.slice(1, -1).trim();
    }
    return url.replace(/^https\/\//i, "https://").replace(/^http\/\//i, "http://");
}

function createThumbnailUrl(url, id) {
    const hostname = url.hostname.toLowerCase();
    const isPervertDomain = hostname.includes('pervertium.com') || hostname.includes('perverttube.com');
    const folder = Math.floor(parseInt(id, 10) / 1000) * 1000;

    if (isPervertDomain) {
        return `${url.origin}/contents/videos_screenshots/${folder}/${encodeURIComponent(id)}/preview.jpg`;
    }
    return `${url.origin}/contents/videos_screenshots/${folder}/${encodeURIComponent(id)}/264x198/1.jpg`;
}

function parseVideoUrl(rawUrl) {
    const cleaned = cleanUrl(rawUrl);
    if (!cleaned) return null;
    let url;
    try { url = new URL(cleaned); } catch (_) { return null; }
    const parts = url.pathname.split("/").filter(Boolean);

    const vIdx = parts.findIndex(p => {
        const lower = p.toLowerCase();
        return lower === "videos" || lower === "video";
    });

    if (vIdx !== -1 && parts[vIdx + 1]) {
        const id = parts[vIdx + 1];
        const titleSlug = parts.slice(vIdx + 2).join("-");
        const title = formatTitle(titleSlug);
        const embedUrl = url.origin + "/embed/" + encodeURIComponent(id);
        const thumbnailUrl = createThumbnailUrl(url, id);
        return { id, title, embedUrl, thumbnailUrl, sourceUrl: url.href };
    }
    return null;
}

                seen.add(video.embedUrl);
                allVideos.push(video);
                if (video.id === videoId) {
                    targetVideo = video;
                }
            }
        }

        allVideosCache = allVideos;
        renderCategoryNavs();

        fuseInstance = new Fuse(allVideos, {
            keys: [{ name: 'title', weight: 0.8 }, { name: 'id', weight: 0.2 }],
            includeScore: true,
            threshold: 0.2,
            distance: 100,
            minMatchCharLength: 2,
            ignoreLocation: true
        });

        if (targetVideo) {
            document.title = `${targetVideo.title} - Sick Fetish`;
            videoTitle.textContent = targetVideo.title;
            videoIframe.src = targetVideo.embedUrl;

            recordWatchHistory(targetVideo.title);

            shareBtn.addEventListener("click", () => {
                const shareUrl = window.location.href;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(shareUrl).then(() => showToast("Link copied to clipboard"));
                } else {
                    showToast("Failed to copy link");
                }
            });

            allOtherVideos = allVideos.filter(v => v.id !== videoId);
            appendMoreVideos(12);

            window.addEventListener("scroll", () => {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
                    appendMoreVideos(8);
                }
            });

        } else {
            videoTitle.textContent = "Video not found in archive.";
        }
    } catch (err) {
        videoTitle.textContent = "Error loading video details.";
    }
}

search.addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    searchFormWrapper.classList.toggle("has-text", q.length > 0);
    if (!q) { searchSuggestions.classList.remove("open"); return; }
    
    const matches = allVideosCache.filter(v => v.title.toLowerCase().includes(q)).slice(0, 6);
    if (!matches.length) { searchSuggestions.classList.remove("open"); return; }

    searchSuggestions.innerHTML = "";
    matches.forEach(video => {
        const item = document.createElement("div");
        item.className = "suggestion-item";
        item.innerHTML = `🔍 <span>${video.title}</span>`;
        item.addEventListener("mousedown", (e) => {
            e.preventDefault();
            window.location.href = `videos.html?search=${encodeURIComponent(video.title)}`;
        });
        searchSuggestions.appendChild(item);
    });
    searchSuggestions.classList.add("open");
});

searchForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const query = search.value.trim();
    if (query) {
        window.location.href = `videos.html?search=${encodeURIComponent(query)}`;
    }
});

searchCancel.addEventListener("click", () => {
    search.value = "";
    searchFormWrapper.classList.remove("has-text");
    searchSuggestions.classList.remove("open");
});

randomButton.addEventListener("click", () => {
    if (allVideosCache.length === 0) return;
    const randomVideo = allVideosCache[Math.floor(Math.random() * allVideosCache.length)];
    window.location.href = `second.html?id=${encodeURIComponent(randomVideo.id)}`;
});

logo.addEventListener("click", () => { window.location.href = "videos.html"; });

initWatchPage();
</script>

</body>
</html>
