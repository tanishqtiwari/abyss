    if (!slug) return "Untitled Video";
    let title = slug;
    try { title = decodeURIComponent(title); } catch (_) {}
    return title.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim().toLowerCase()
        .split(" ").map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : "").join(" ") || "Untitled Video";
}

function cleanUrl(rawUrl) {
    let url = String(rawUrl || "").trim();
    if (url.length >= 2 && ((url.startsWith('"') && url.endsWith('"')) || (url.startsWith("'") && url.endsWith("'")))) {
        url = url.slice(1, -1).trim();
    }
    return url.replace(/^https\/\//i, "https://").replace(/^http\/\//i, "http://");
}

function createThumbnailUrl(url, id) {
    const hostname = url.hostname.toLowerCase();
    const isPervertDomain = hostname.includes('pervertium.com') || hostname.includes('perverttube.com');
    const folder = Math.floor(parseInt(id, 10) / 1000) * 1000;

    if (isPervertDomain) {
        return `${url.origin}/contents/videos_screenshots/${folder}/${encodeURIComponent(id)}/preview.jpg`;
    }
    return `${url.origin}/contents/videos_screenshots/${folder}/${encodeURIComponent(id)}/264x198/1.jpg`;
}

function parseVideoUrl(rawUrl) {
    const cleaned = cleanUrl(rawUrl);
    if (!cleaned) return null;
    let url;
    try { url = new URL(cleaned); } catch (_) { return null; }
    const parts = url.pathname.split("/").filter(Boolean);

    const vIdx = parts.findIndex(p => {
        const lower = p.toLowerCase();
        return lower === "videos" || lower === "video";
    });

    if (vIdx !== -1 && parts[vIdx + 1]) {
        const id = parts[vIdx + 1];
        const titleSlug = parts.slice(vIdx + 2).join("-");
        const title = formatTitle(titleSlug);
        const embedUrl = url.origin + "/embed/" + encodeURIComponent(id);
        const thumbnailUrl = createThumbnailUrl(url, id);
        return { id, title, embedUrl, thumbnailUrl, sourceUrl: url.href };
    }
    return null;
}

function buildHybridRecommendations(currentVideo, videoList) {
    const titleWords = currentVideo.title.toLowerCase().split(" ").filter(w => w.length > 3);
    
    const relevantMatches = [];
    const randomOthers = [];

    videoList.forEach(v => {
        if (v.id === currentVideo.id) return;
        const lowerTitle = v.title.toLowerCase();
        
        const isMatch = titleWords.some(word => lowerTitle.includes(word));
        if (isMatch) {
            relevantMatches.push(v);
        } else {
            randomOthers.push(v);
        }
    });

    const shuffledRelevant = shuffle(relevantMatches);
    const shuffledRandom = shuffle(randomOthers);

    const blended = [];
    let relIdx = 0;
    let randIdx = 0;

    while (relIdx < shuffledRelevant.length || randIdx < shuffledRandom.length) {
        if (relIdx < shuffledRelevant.length) blended.push(shuffledRelevant[relIdx++]);
        if (relIdx < shuffledRelevant.length) blended.push(shuffledRelevant[relIdx++]);
        if (randIdx < shuffledRandom.length) blended.push(shuffledRandom[randIdx++]);
    }

    return blended;
}

function appendMoreVideos(count) {
    const batch = recommendedQueue.slice(loadedCount, loadedCount + count);
    if (batch.length === 0) return;

    const params = new URLSearchParams(window.location.search);
    const fromQ = params.get("from_q");
    const fromCat = params.get("from_cat");

    batch.forEach(video => {
        const a = document.createElement("a");
        a.className = "card";
        
        let targetHref = `second.html?id=${encodeURIComponent(video.id)}`;
        if (fromQ) {
            targetHref += `&from_q=${encodeURIComponent(fromQ)}`;
        } else if (fromCat) {
            targetHref += `&from_cat=${encodeURIComponent(fromCat)}`;
        }

        a.href = targetHref;

        const thumb = document.createElement("div");
        thumb.className = "thumbnail";
        if (video.thumbnailUrl) {
            const img = document.createElement("img");
            img.src = video.thumbnailUrl;
            img.alt = video.title;
            img.loading = "lazy";
            thumb.appendChild(img);
        }

        const titleDiv = document.createElement("div");
        titleDiv.className = "title";
        titleDiv.textContent = video.title;

        a.appendChild(thumb);
        a.appendChild(titleDiv);
        grid.appendChild(a);
    });

    loadedCount += batch.length;
}

async function initWatchPage() {
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("id");
    const fromQ = params.get("from_q");

    if (fromQ) {
        search.value = fromQ;
        searchFormWrapper.classList.add("has-text");
    }

    if (!videoId) {
        videoTitle.textContent = "Video not found.";
        return;
    }

    try {
        const response = await fetch(CSV_URL, { cache: "no-cache" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const text = await response.text();
        const urls = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

        const list = [];
        const seen = new Set();
        let targetVideo = null;

        for (const rawUrl of urls) {
            const video = parseVideoUrl(rawUrl);
            if (video && !seen.has(video.embedUrl)) {
                seen.add(video.embedUrl);
                if (video.id === videoId) {
                    targetVideo = video;
                }
                list.push(video);
            }
        }

        allVideos = list;
        renderCategoryNavs();

        if (!targetVideo) {
            videoTitle.textContent = "Video not found in archive.";
            return;
        }

        document.title = `${targetVideo.title} - Sick Fetish`;
        videoTitle.textContent = targetVideo.title;
        videoIframe.src = targetVideo.embedUrl;

        recordWatchHistory(targetVideo.title);

        shareBtn.addEventListener("click", () => {
            const shareUrl = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl).then(() => showToast("Link copied to clipboard!"));
            } else {
                showToast("Failed to copy link");
            }
        });

        recommendedQueue = buildHybridRecommendations(targetVideo, allVideos);
        appendMoreVideos(12);

        window.addEventListener("scroll", () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
                appendMoreVideos(8);
            }
        });

    } catch (err) {
        videoTitle.textContent = "Error loading video details.";
    }
}

search.addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    searchFormWrapper.classList.toggle("has-text", q.length > 0);
    if (!q || !allVideos.length) { searchSuggestions.classList.remove("open"); return; }
    
    const matches = allVideos.filter(v => v.title.toLowerCase().includes(q)).slice(0, 6);
    if (!matches.length) { searchSuggestions.classList.remove("open"); return; }

    searchSuggestions.innerHTML = "";
    matches.forEach(video => {
        const item = document.createElement("div");
        item.className = "suggestion-item";
        item.innerHTML = `🔍 <span>${video.title}</span>`;
        item.addEventListener("mousedown", (e) => {
            e.preventDefault();
            navigateToArchive(video.title, null);
        });
        searchSuggestions.appendChild(item);
    });
    searchSuggestions.classList.add("open");
});

searchForm.addEventListener("submit", (e) => {
    e.preventDefault();
    searchSuggestions.classList.remove("open");
    const query = search.value.trim();
    if (query) {
        navigateToArchive(query, null);
    }
});

searchCancel.addEventListener("click", () => {
    search.value = "";
    searchFormWrapper.classList.remove("has-text");
    searchSuggestions.classList.remove("open");
});

randomButton.addEventListener("click", () => {
    if (allVideos.length === 0) return;
    const randomVideo = allVideos[Math.floor(Math.random() * allVideos.length)];
    window.location.href = `second.html?id=${encodeURIComponent(randomVideo.id)}`;
});

logo.addEventListener("click", () => { window.location.href = "videos.html"; });

initWatchPage();
</script>
