<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    padding-bottom: 70px;

    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(255,255,255,.018),
            transparent 24%

        radial-gradient(

            transparent 26%

    color: #dddddd;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   VARIABLES
===================================================== */

:root {

    --bg:
        #050505;

    --surface:
        #0b0b0b;

    --surface-2:
        #111111;

    --border:
        #242424;

    --border-light:
        #2d2d2d;

    --text:
        #dddddd;

    --text-bright:
        #eeeeee;

    --muted:
        #666666;

    --muted-dark:
        #454545;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position:
        sticky;

    top:
        0;

    z-index:
        100;

    background:
        rgba(5,5,5,.95);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid #171717;
}


.header-inner {

    width:
        min(1400px,94%);

    min-height:
        76px;

    margin:
        auto;

    display:
        flex;

    align-items:
        center;

    gap:
        24px;
}


/* =====================================================
   LOGO
===================================================== */

.logo {

    width:
        190px;

    aspect-ratio:
        1600 / 380;

    flex-shrink:
        0;

    overflow:
        hidden;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    cursor:
        pointer;

    user-select:
        none;
}


.logo img {

    width:
        100%;

    height:
        100%;

    object-fit:
        contain;

    display:
        block;

    filter:
        none;

    transition:
        transform .2s ease;
}


.logo:hover img {

    transform:
        scale(1.025);
}


/* =====================================================
   SEARCH WRAPPER
===================================================== */

.search-wrapper {

    position:
        relative;

    flex:
        1;

    max-width:
        620px;

    margin:
        auto;
}


/* =====================================================
   SEARCH
===================================================== */

.search {

    width:
        100%;

    height:
        43px;

    padding:
        0 44px 0 17px;

    background:
        #090909;

    color:
        #dddddd;

    border:
        1px solid #242424;

    border-radius:
        11px;

    outline:
        none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        13px;

    box-shadow:
        3px 3px 0 #020202;

    transition:
        border-color .2s ease,
        background .2s ease;
}


.search::placeholder {

    color:
        #444444;
}


.search:focus {

    border-color:
        #3b3b3b;

    background:
        #0d0d0d;
}


/* =====================================================
   SEARCH CANCEL
===================================================== */

.search-cancel {

    position:
        absolute;

    right:
        7px;

    top:
        50%;

    transform:
        translateY(-50%);

    width:
        30px;

    height:
        30px;

    padding:
        0;

    border:
        0;

    border-radius:
        8px;

    background:
        transparent;

    color:
        #555555;

    cursor:
        pointer;

    font-size:
        20px;

    line-height:
        30px;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    transition:
        background .15s ease,
        color .15s ease;
}


.search-wrapper.has-text .search-cancel {

    display:
        flex;
}


.search-cancel:hover {

    background:
        #191919;

    color:
        #dddddd;
}


/* =====================================================
   RANDOM BUTTON
===================================================== */

.random-button {

    height:
        43px;

    flex-shrink:
        0;

    border:

        11px;

    background:
        #0b0b0b;

    color:
        #666666;

    cursor:
        pointer;

    font-size:
        21px;

    box-shadow:
        3px 3px 0 #020202;

    transition:
        .2s ease;
}


.random-button:hover {

    background:
        #111111;

    transform:

}


/* =====================================================
   MAIN
===================================================== */

.main {

    width:
        min(1400px,94%);

    margin:
        auto;

    padding:
        36px 0 0;
}


/* =====================================================
   SECTION HEADER
===================================================== */

.top-bar {

    margin-bottom:
        29px;
}


.heading {

    margin:
        0;

    color:
        #e1e1e1;

    font-size:
        29px;

    font-weight:

    letter-spacing:

.status {

/* =====================================================
   LOADER
===================================================== */

.loader {

    width:

    margin:
        55px auto;

    border:
        3px solid #272727;

    border-top-color:
        #b0b0b0;

    border-radius:
        50%;

    animation:
        spin .75s linear infinite;
}


@keyframes spin {

    to {

        transform:
            rotate(360deg);
    }

}


/* =====================================================
   GRID
===================================================== */

.grid {

    display:
        grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:
        30px 17px;
}


/* =====================================================
   CARD
===================================================== */

.card {

    min-width:
        0;

    cursor:
        pointer;

    transition:
        transform .2s ease;
}


.card:nth-child(4n+1) {

    transform:
        rotate(-.3deg);
}


.card:nth-child(4n+2) {

    transform:
        rotate(.2deg);
}


.card:nth-child(4n+3) {

    transform:
        rotate(-.15deg);
}


.card:nth-child(4n) {

    transform:
        rotate(.25deg);
}


.card:hover {

    transform:
        translateY(-5px)
        rotate(0deg);
}


/* =====================================================
   THUMBNAIL
===================================================== */

.thumbnail {

    position:
        relative;

    width:
        100%;

    aspect-ratio:
        16 / 10;

    overflow:
        hidden;

    background:
        linear-gradient(
            135deg,
            #151515,
            #070707
        );

    border:
        1px solid #222222;

    border-radius:
        10px;

    box-shadow:
        4px 5px 0 #020202;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}


.card:hover .thumbnail {

    border-color:
        #353535;

    box-shadow:
        5px 7px 0 #010101;
}


/* =====================================================
   THUMBNAIL IMAGE
===================================================== */

.thumbnail img {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    display:
        block;

    object-fit:
        cover;

    opacity:
        .9;

    transition:
        transform .4s ease,
        opacity .25s ease,
        filter .25s ease;
}


.card:hover .thumbnail img {

    transform:
        scale(1.055);

    opacity:
        .72;

    filter:
        brightness(.8);
}


/* =====================================================
   SUBTLE THUMBNAIL DETAIL
===================================================== */

.thumbnail::before {

    content:
        "";

    position:
        absolute;

    z-index:
        4;

    left:
        8px;

    top:
        8px;

    width:
        6px;

    height:
        6px;

    border-radius:
        50%;

    background:
        #555555;

    opacity:
        .8;
}


/* =====================================================
   TITLE
===================================================== */

.title {

    padding:

    color:
        #cfcfcf;

    font-size:
        13px;

    font-weight:
        600;

    line-height:
        1.4;

    letter-spacing:
        -.1px;

    display:
        -webkit-box;

    -webkit-line-clamp:
        2;

    -webkit-box-orient:
        vertical;

    overflow:
        hidden;

    transition:
        color .2s ease;
}


.card:hover .title {

        #eeeeee;
}

===================================================== */

/* =====================================================
   EMPTY
===================================================== */

    color:

/* =====================================================

.modal.open {

.video-container iframe {

    color:

        12px;

    box-shadow:
        4px 5px 0 #000000;

    opacity:
        0;

    transform:
        translate(-50%,20px);

    pointer-events:
        none;

    transition:
        opacity .2s ease,
        transform .2s ease;
}


.toast.show {

    opacity:
        1;

    transform:
        translate(-50%,0);

/* =====================================================

/*
CSV is in the SAME folder as videos.html.

const CSV_URL =

/*
Exactly 30 videos per page.
*/

/* =====================================================

const grid =

    );


const search =

    );

        "modalShare"
    );

    document.getElementById(
        "videoContainer"
    );

    document.getElementById(
        "close"
    );


const toast =
    document.getElementById(
        "toast"
    );


/* =====================================================
   STATE
===================================================== */

let videos =
    [];

let filteredVideos =
    [];

let currentPage =
    1;

let currentVideo =
    null;

let toastTimer =
    null;


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    const result =
        [...array];


    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];
    }


    return result;
}


/* =====================================================
   FORMAT TITLE
===================================================== */

function formatTitle(
    slug
) {

    if (!slug) {

        return "Untitled Video";
    }


    let title =
        slug;


    try {

        title =
            decodeURIComponent(
                title
            );

    }

    catch (_) {

        // Ignore decoding errors.
    }


    title =
        title
            .replace(
                /[-_]+/g,
                " "
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    return title
        .toLowerCase()
        .split(" ")
        .map(
            word => {

                if (!word) {
                    return "";
                }


                return (
                    word.charAt(0).toUpperCase()
                    +
                    word.slice(1)
                );

            }
        )
        .join(" ")
        ||
        "Untitled Video";
}


/* =====================================================
   CLEAN URL
===================================================== */

function cleanUrl(
    rawUrl
) {

    let url =
        String(
            rawUrl || ""
        ).trim();


    /*
    Remove surrounding quotes.
    */

    if (
        url.length >= 2 &&
        (
            (
                url.startsWith('"') &&
                url.endsWith('"')
            )
            ||
            (
                url.startsWith("'") &&
                url.endsWith("'")
            )
        )
    ) {

        url =
            url.slice(
                1,
                -1
            ).trim();
    }


    /*
    Fix accidental:

    https//example.com

    */

    url =
        url.replace(
            /^https\/\//i,
            "https://"
        );


    url =
        url.replace(
            /^http\/\//i,
            "http://"
        );


    return url;
}


/* =====================================================
   THUMBNAIL FOLDER
===================================================== */

function getThumbnailFolder(
    id
) {

    const number =
        parseInt(
            id,
            10
        );


    if (
        Number.isNaN(
            number
        )
    ) {

        return null;
    }


    /*
    1-999   → 0
    1000-1999 → 1000
    2000-2999 → 2000
    */

    return (
        Math.floor(
            number / 1000
        )
        *
        1000
    );
}


/* =====================================================
   THUMBNAIL URL
===================================================== */

function createThumbnailUrl(
    url,
    id
) {

    const folder =
        getThumbnailFolder(
            id
        );


    if (
        folder === null
    ) {

        return null;
    }


    return (
        url.origin
        +
        "/contents/videos_screenshots/"
        +
        folder
        +
        "/"
        +
        encodeURIComponent(
            id
        )
        +
        "/264x198/1.jpg"
    );
}


/* =====================================================
   PARSE VIDEO URL
===================================================== */

function parseVideoUrl(
    rawUrl
) {

    const cleaned =
        cleanUrl(
            rawUrl
        );


    if (!cleaned) {

        return null;
    }


    let url;


    try {

        url =
            new URL(
                cleaned
            );

    }

    catch (_) {

        return null;
    }


    const parts =
        url.pathname
            .split("/")
            .filter(
                Boolean
            );


    /*
    ================================================
    /videos/ID/title
    ================================================
    */

    const videosIndex =
        parts.findIndex(
            part =>
                part.toLowerCase()
                ===
                "videos"
        );


    if (
        videosIndex !== -1 &&
        parts[
            videosIndex + 1
        ]
    ) {


        const id =
            parts[
                videosIndex + 1
            ];


        const titleSlug =
            parts
                .slice(
                    videosIndex + 2
                )
                .join("-");


        const title =
            formatTitle(
                titleSlug
            );


        const embedUrl =
            url.origin
            +
            "/embed/"
            +
            encodeURIComponent(
                id
            );


        const thumbnailUrl =
            createThumbnailUrl(
                url,
                id
            );


        return {

            id:
                id,

            title:
                title,

            embedUrl:
                embedUrl,

            thumbnailUrl:
                thumbnailUrl,

            sourceUrl:
                url.href
        };
    }


    /*
    ================================================
    /embed/ID
    ================================================
    */

    const embedIndex =
        parts.findIndex(
            part =>
                part.toLowerCase()
                ===
                "embed"
        );


    if (
        embedIndex !== -1 &&
        parts[
            embedIndex + 1
        ]
    ) {


        const id =
            parts[
                embedIndex + 1
            ];


        return {

            id:
                id,

            title:
                "Video",

            embedUrl:
                url.href,

            thumbnailUrl:
                createThumbnailUrl(
                    url,
                    id
                ),

            sourceUrl:
                url.href
        };
    }


    return null;
}


/* =====================================================
   PARSE CSV
===================================================== */

function parseCSV(
    text
) {

    return String(
        text || ""
    )
        .split(
            /\r?\n/
        )
        .map(
            line =>
                line.trim()
        )
        .filter(
            Boolean
        );
}


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos() {

    try {


        status.textContent =
            "Loading video list...";


        /*
        Fetch CSV.
        */

        const response =
            await fetch(
                CSV_URL,
                {
                    method:
                        "GET",

                    cache:
                        "no-cache"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const text =
            await response.text();


        const urls =
            parseCSV(
                text
            );


        const results =
            [];

        const seen =
            new Set();


        /*
        Convert every line
        into a video object.
        */

        for (
            const rawUrl
            of urls
        ) {


            const video =
                parseVideoUrl(
                    rawUrl
                );


            if (!video) {

                continue;
            }


            /*
            Deduplicate by embed URL.
            */

            if (
                seen.has(
                    video.embedUrl
                )
            ) {

                continue;
            }


            seen.add(
                video.embedUrl
            );


            results.push(
                video
            );
        }


        /*
        RANDOMIZE THE ENTIRE
        ARCHIVE ON EVERY PAGE LOAD.
        */

        videos =
            shuffle(
                results
            );


        filteredVideos =
            [...videos];


        loader.style.display =
            "none";


        heading.textContent =
            "Latest Videos";


        status.textContent =
            `${videos.length.toLocaleString()} videos available`;


        render();


        /*
        If somebody shared:

        ?video=2283

        automatically open it.
        */

        openVideoFromUrl();


    }

    catch (error) {


        console.error(
            "CSV ERROR:",
            error
        );


        loader.style.display =
            "none";


        status.textContent =
            "Could not load links.csv";


        empty.textContent =
            "Could not load links.csv. Make sure videos.html and links.csv are in the same folder.";


        empty.style.display =
            "block";
    }
}


/* =====================================================
   RENDER
===================================================== */

function render() {

    grid.innerHTML =
        "";

    pagination.innerHTML =
        "";


    if (
        filteredVideos.length === 0
    ) {

        empty.style.display =
            "block";

        return;
    }


    empty.style.display =
        "none";


    const totalPages =
        Math.ceil(
            filteredVideos.length /
            VIDEOS_PER_PAGE
        );


    if (
        currentPage >
        totalPages
    ) {

        currentPage =
            totalPages;
    }


    const start =
        (
            currentPage - 1
        )
        *
        VIDEOS_PER_PAGE;


    const pageVideos =
        filteredVideos.slice(
            start,
            start + VIDEOS_PER_PAGE
        );


    const fragment =
        document.createDocumentFragment();


    for (
        const video
        of pageVideos
    ) {

        fragment.appendChild(
            createCard(
                video
            )
        );
    }


    grid.appendChild(
        fragment
    );


    renderPagination(
        totalPages
    );
}


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(
    video
) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "card";


    /*
    Thumbnail.
    */

    const thumbnail =
        document.createElement(
            "div"
        );


    thumbnail.className =
        "thumbnail";


    /*
    Thumbnail image.
    */

    if (
        video.thumbnailUrl
    ) {


        const image =
            document.createElement(
                "img"
            );


        image.src =
            video.thumbnailUrl;


        image.alt =
            video.title;


        image.loading =
            "lazy";


        /*
        If thumbnail 1.jpg doesn't exist,
        remove it and keep the dark background.
        */

        image.onerror =
            function() {

                this.remove();
            };


        thumbnail.appendChild(
            image
        );
    }


    /*
    Title only.
    */

    const title =
        document.createElement(
            "div"
        );


    title.className =
        "title";


    title.textContent =
        video.title;


    card.appendChild(
        thumbnail
    );


    card.appendChild(
        title
    );


    /*
    Clicking card opens player.
    */

    card.addEventListener(
        "click",
        function() {

            openVideo(
                video
            );
        }
    );


    return card;
}


/* =====================================================
   PAGINATION
===================================================== */

function renderPagination(
    totalPages
) {

    if (
        totalPages <= 1
    ) {

        return;
    }


    /*
    Previous.
    */

    const previous =
        document.createElement(
            "button"
        );


    previous.className =
        "page-button";


    previous.textContent =
        "‹";


    previous.disabled =
        currentPage === 1;


    previous.addEventListener(
        "click",
        function() {

            if (
                currentPage <= 1
            ) {

                return;
            }


            currentPage--;


            render();


            scrollTop();
        }
    );


    pagination.appendChild(
        previous
    );


    /*
    Show a compact range of pages.
    */

    let start =
        Math.max(
            1,
            currentPage - 2
        );


    let end =
        Math.min(
            totalPages,
            currentPage + 2
        );


    /*
    Page buttons.
    */

    for (
        let page = start;
        page <= end;
        page++
    ) {


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "page-button";


        button.textContent =
            page;


        if (
            page === currentPage
        ) {

            button.classList.add(
                "active"
            );
        }


        button.addEventListener(
            "click",
            function() {

                currentPage =
                    page;


                render();


                scrollTop();
            }
        );


        pagination.appendChild(
            button
        );
    }


    /*
    Next.
    */

    const next =
        document.createElement(
            "button"
        );


    next.className =
        "page-button";


    next.textContent =
        "›";


    next.disabled =
        currentPage === totalPages;


    next.addEventListener(
        "click",
        function() {

            if (
                currentPage >= totalPages
            ) {

                return;
            }


            currentPage++;


            render();


            scrollTop();
        }
    );


    pagination.appendChild(
        next
    );
}


/* =====================================================
   SEARCH UI
===================================================== */

function updateSearchUI() {

    if (
        search.value.trim()
    ) {

        searchWrapper.classList.add(
            "has-text"
        );

    }

    else {

        searchWrapper.classList.remove(
            "has-text"
        );
    }
}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
    "input",
    function() {

        updateSearchUI();


        const query =
            this.value
                .trim()
                .toLowerCase();


        /*
        No search.
        */

        if (!query) {


            heading.textContent =
                "Latest Videos";


            filteredVideos =
                [...videos];


            currentPage =
                1;


            status.textContent =
                `${videos.length.toLocaleString()} videos available`;


            render();


            return;
        }


        /*
        Find matches first.
        */

        const matches =
            videos.filter(
                video =>
                    video.title
                        .toLowerCase()
                        .includes(
                            query
                        )
            );


        /*
        IMPORTANT:

        Randomize search results,
        so the ordering changes every
        time the search is performed.
        */

        filteredVideos =
            shuffle(
                matches
            );


        currentPage =
            1;


        heading.textContent =
            "Search Results";


        status.textContent =
            `${filteredVideos.length.toLocaleString()} results`;


        render();
    }
);


/* =====================================================
   CANCEL SEARCH
===================================================== */

searchCancel.addEventListener(
    "click",
    function() {

        search.value =
            "";


        updateSearchUI();


        /*
        Return to main archive.
        */

        filteredVideos =
            [...videos];


        currentPage =
            1;


        heading.textContent =
            "Latest Videos";


        status.textContent =
            `${videos.length.toLocaleString()} videos available`;


        render();


        /*
        Remove shared video parameter.
        */

        const url =
            new URL(
                window.location.href
            );


        url.searchParams.delete(
            "video"
        );


        window.history.replaceState(
            {},
            "",
            url
        );


        search.focus();
    }
);


/* =====================================================
   LOGO → HOME
===================================================== */

function goHome() {

    /*
    Clear search.
    */

    search.value =
        "";


    updateSearchUI();


    /*
    Restore main archive.
    */

    filteredVideos =
        [...videos];


    currentPage =
        1;


    heading.textContent =
        "Latest Videos";


    status.textContent =
        `${videos.length.toLocaleString()} videos available`;


    render();


    /*
    Close player.
    */

    closeVideo();


    /*
    Remove video query parameter.
    */

    const url =
        new URL(
            window.location.href
        );


    url.searchParams.delete(
        "video"
    );


    window.history.replaceState(
        {},
        "",
        url
    );


    /*
    Go to top.
    */

    window.scrollTo({

        top:
            0,

        behavior:
            "smooth"
    });
}


logo.addEventListener(
    "click",
    goHome
);


logo.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            goHome();
        }
    }
);


/* =====================================================
   RANDOM VIDEO
===================================================== */

randomButton.addEventListener(
    "click",
    function() {

        if (
            videos.length === 0
        ) {

            return;
        }


        const randomIndex =
            Math.floor(
                Math.random() *
                videos.length
            );


        openVideo(
            videos[
                randomIndex
            ]
        );
    }
);


/* =====================================================
   OPEN VIDEO
===================================================== */

function openVideo(
    video
) {

    if (!video) {
        return;
    }


    currentVideo =
        video;


    /*
    Set title.
    */

    modalTitle.textContent =
        video.title;


    /*
    Clear existing iframe.
    */

    videoContainer.innerHTML =
        "";


    /*
    Create iframe only now.
    */

    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.src =
        video.embedUrl;


    iframe.setAttribute(
        "allowfullscreen",
        ""
    );


    iframe.setAttribute(
        "allow",
        "autoplay; fullscreen; picture-in-picture; encrypted-media"
    );


    iframe.setAttribute(
        "referrerpolicy",
        "strict-origin-when-cross-origin"
    );


    iframe.setAttribute(
        "title",
        video.title
    );


    /*
    Add player.
    */

    videoContainer.appendChild(
        iframe
    );


    /*
    Put video ID in URL so the
    page can be shared.
    */

    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "video",
        video.id
    );


    window.history.replaceState(
        {},
        "",
        url
    );


    /*
    Open modal.
    */

    modal.classList.add(
        "open"
    );


    modal.setAttribute(
        "aria-hidden",
        "false"
    );


    document.body.style.overflow =
        "hidden";
}


/* =====================================================
   OPEN VIDEO FROM SHARED URL
===================================================== */

function openVideoFromUrl() {

    const url =
        new URL(
            window.location.href
        );


    const videoId =
        url.searchParams.get(
            "video"
        );


    if (!videoId) {

        return;
    }


    const video =
        videos.find(
            item =>
                String(item.id)
                ===
                String(videoId)
        );


    if (!video) {

        /*
        Invalid video ID.
        Remove it from URL.
        */

        url.searchParams.delete(
            "video"
        );


        window.history.replaceState(
            {},
            "",
            url
        );


        return;
    }


    openVideo(
        video
    );
}


/* =====================================================
   SHARE CURRENT VIDEO
===================================================== */

async function shareCurrentVideo() {

    if (!currentVideo) {

        return;
    }


    const url =
        new URL(
            window.location.href
        );


    url.searchParams.set(
        "video",
        currentVideo.id
    );


    const shareUrl =
        url.href;


    /*
    Native share menu.
    */

    if (
        navigator.share
    ) {

        try {

            await navigator.share({

                title:
                    currentVideo.title,

                text:
                    "Watch " +
                    currentVideo.title,

                url:
                    shareUrl
            });


            return;

        }

        catch (error) {

            /*
            User cancelled native
            sharing.
            */

            if (
                error.name ===
                "AbortError"
            ) {

                return;
            }
        }
    }


    /*
    Clipboard fallback.
    */

    try {

        await navigator.clipboard.writeText(
            shareUrl
        );


        showToast(
            "Link copied"
        );

    }

    catch (_) {

        /*
        Fallback for older browsers.
        */

        const input =
            document.createElement(
                "input"
            );


        input.value =
            shareUrl;


        document.body.appendChild(
            input
        );


        input.select();


        input.setSelectionRange(
            0,
            input.value.length
        );


        try {

            document.execCommand(
                "copy"
            );

            showToast(
                "Link copied"
            );

        }

        catch (_) {

            showToast(
                "Copy failed"
            );
        }


        input.remove();
    }
}


/* =====================================================
   SHARE BUTTON
===================================================== */

modalShare.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        shareCurrentVideo();
    }
);


/* =====================================================
   CLOSE VIDEO
===================================================== */

function closeVideo() {

    /*
    Destroy iframe.

    This stops playback and releases
    the embedded player.
    */

    videoContainer.innerHTML =
        "";


    currentVideo =
        null;


    modal.classList.remove(
        "open"
    );


    modal.setAttribute(
        "aria-hidden",
        "true"
    );


    document.body.style.overflow =
        "";


    /*
    Remove video parameter from URL.
    */

    const url =
        new URL(
            window.location.href
        );


    url.searchParams.delete(
        "video"
    );


    window.history.replaceState(
        {},
        "",
        url
    );
}


/* =====================================================
   CLOSE BUTTON
===================================================== */

closeButton.addEventListener(
    "click",
    closeVideo
);


/* =====================================================
   CLICK OUTSIDE MODAL
===================================================== */

modal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === modal
        ) {

            closeVideo();
        }
    }
);


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            modal.classList.contains(
                "open"
            )
        ) {

            closeVideo();
        }
    }
);


/* =====================================================
   TOAST
===================================================== */

function showToast(
    message
) {

    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
}


/* =====================================================
   SCROLL TOP
===================================================== */

function scrollTop() {

    window.scrollTo({

        top:
            0,

        behavior:
            "smooth"
    });
}


/* =====================================================
   START
===================================================== */

loadVideos();

</script>
