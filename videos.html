<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#050505">

<title>Video Archive</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    padding-bottom: 70px;

    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(255,255,255,.018),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(255,255,255,.012),
            transparent 25%
        ),
        #050505;

    color: #ddd;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: sticky;
    top: 0;
    z-index: 100;

    background:
        rgba(5,5,5,.94);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid #171717;
}


.header-inner {

    width:
        min(1400px,94%);

    min-height:
        78px;

    margin:
        auto;

    display:
        flex;

    align-items:
        center;

    gap:
        24px;
}


/* =====================================================
   LOGO
===================================================== */

.logo {

    width:
        190px;

    aspect-ratio:
        1600 / 380;

    flex-shrink:
        0;

    overflow:
        hidden;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;
}


.logo img {

    width:
        100%;

    height:
        100%;

    object-fit:
        contain;

    display:
        block;

    filter:
        none;
}


/* =====================================================
   SEARCH
===================================================== */

.search-wrapper {

    flex:
        1;

    max-width:
        620px;

    margin:
        auto;
}


.search {

    width:
        100%;

    height:
        43px;

    padding:
        0 17px;

    background:
        #090909;

    border:
        1px solid #242424;

    border-radius:
        11px;

    outline:
        none;

    color:
        #ddd;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        13px;

    box-shadow:
        3px 3px 0 #020202;

    transition:
        .2s ease;
}


.search::placeholder {

    color:
        #444;
}


.search:focus {

    border-color:
        #3a3a3a;

    background:
        #0c0c0c;
}


/* =====================================================
   RANDOM BUTTON
===================================================== */

.random-button {

    width:
        43px;

    height:
        43px;

    flex-shrink:
        0;

    border:
        1px solid #292929;

    border-radius:
        11px;

    background:
        #0b0b0b;

    color:
        #666;

    cursor:
        pointer;

    font-size:
        21px;

    box-shadow:
        3px 3px 0 #020202;

    transition:
        .2s ease;
}


.random-button:hover {

    color:
        #ddd;

    background:
        #111;

    transform:
        rotate(8deg)
        translateY(-2px);
}


/* =====================================================
   MAIN
===================================================== */

.main {

    width:
        min(1400px,94%);

    margin:
        0 auto;

    padding:
        38px 0 0;
}


/* =====================================================
   TOP BAR
===================================================== */

.top-bar {

    margin-bottom:
        30px;
}


.heading {

    margin:
        0;

    color:
        #e1e1e1;

    font-size:
        28px;

    font-weight:
        700;

    letter-spacing:
        -.6px;

    line-height:
        1;
}


.status {

    margin-top:
        9px;

    color:
        #454545;

    font-size:
        11px;
}


/* =====================================================
   LOADER
===================================================== */

.loader {

    width:
        32px;

    height:
        32px;

    margin:
        50px auto;

    border:
        3px solid #262626;

    border-top-color:
        #aaa;

    border-radius:
        50%;

    animation:
        spin .8s linear infinite;
}


@keyframes spin {

    to {
        transform:
            rotate(360deg);
    }

}


/* =====================================================
   GRID
===================================================== */

.grid {

    display:
        grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap:
        30px 17px;
}


/* =====================================================
   CARD
===================================================== */

.card {

    min-width:
        0;

    cursor:
        pointer;

    transition:
        transform .2s ease;
}


/*
Small irregular rotations give the
cards the slightly handmade feel.
*/

.card:nth-child(4n+1) {

    transform:
        rotate(-.35deg);
}


.card:nth-child(4n+2) {

    transform:
        rotate(.25deg);
}


.card:nth-child(4n+3) {

    transform:
        rotate(-.15deg);
}


.card:nth-child(4n) {

    transform:
        rotate(.35deg);
}


.card:hover {

    transform:
        translateY(-6px)
        rotate(0deg);
}


/* =====================================================
   THUMBNAIL
===================================================== */

.thumbnail {

    position:
        relative;

    width:
        100%;

    aspect-ratio:
        16 / 10;

    overflow:
        hidden;

    background:
        linear-gradient(
            135deg,
            #141414,
            #070707
        );

    border:
        1px solid #222;

    border-radius:
        10px;

    box-shadow:
        4px 5px 0 #020202;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}


.card:hover .thumbnail {

    border-color:
        #353535;

    box-shadow:
        5px 7px 0 #010101;
}


/* =====================================================
   THUMBNAIL IMAGE
===================================================== */

.thumbnail img {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    display:
        block;

    object-fit:
        cover;

    opacity:
        .88;

    transition:
        transform .45s ease,
        opacity .25s ease;
}


.card:hover .thumbnail img {

    transform:
        scale(1.06);

    opacity:
        .62;
}


/* =====================================================
   CORNER DETAIL
===================================================== */

.thumbnail::before {

    content:
        "";

    position:
        absolute;

    z-index:
        4;

    left:
        8px;

    top:
        8px;

    width:
        6px;

    height:
        6px;

    border-radius:
        50%;

    background:
        #555;
}


/* =====================================================
   PLAY BUTTON
===================================================== */

.play-overlay {

    position:
        absolute;

    inset:
        0;

    z-index:
        5;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    opacity:
        0;

    transition:
        opacity .2s ease;
}


.card:hover .play-overlay {

    opacity:
        1;
}


.play {

    width:
        54px;

    height:
        54px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding-left:
        3px;

    border:
        1px solid #777;

    border-radius:
        17px;

    background:
        #151515;

    color:
        #ddd;

    font-size:
        18px;

    box-shadow:
        4px 5px 0 #000;

    transform:
        rotate(-4deg);

    transition:
        .2s ease;
}


.card:hover .play {

    transform:
        rotate(4deg)
        scale(1.08);
}


/* =====================================================
   TITLE
===================================================== */

.title {

    padding:
        11px 2px 0;

    color:
        #cfcfcf;

    font-size:
        13px;

    font-weight:
        600;

    line-height:
        1.4;

    letter-spacing:
        -.1px;

    display:
        -webkit-box;

    -webkit-line-clamp:
        2;

    -webkit-box-orient:
        vertical;

    overflow:
        hidden;

    transition:
        color .2s ease;
}


.card:hover .title {

    color:
        #eee;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    display:
        none;

    padding:
        100px 20px;

    text-align:
        center;

    color:
        #444;

    font-size:
        13px;
}


/* =====================================================
   PAGINATION
===================================================== */

.pagination {

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    flex-wrap:
        wrap;

    gap:
        7px;

    margin-top:
        60px;
}


.page-button {

    min-width:
        39px;

    height:
        39px;

    padding:
        0 10px;

    border:
        1px solid #242424;

    border-radius:
        10px;

    background:
        #090909;

    color:
        #555;

    cursor:
        pointer;

    font-size:
        12px;

    box-shadow:
        2px 3px 0 #020202;

    transition:
        .18s ease;
}


.page-button:hover {

    color:
        #ccc;

    background:
        #111;

    transform:
        translateY(-2px);
}


.page-button.active {

    color:
        #111;

    background:
        #ddd;

    border-color:
        #ddd;

    font-weight:
        700;

    transform:
        rotate(-3deg);

    box-shadow:
        3px 4px 0 #000;
}


.page-button:disabled {

    opacity:
        .2;

    cursor:
        default;

    transform:
        none;
}


/* =====================================================
   MODAL
===================================================== */

.modal {

    position:
        fixed;

    inset:
        0;

    z-index:
        1000;

    display:
        none;

    align-items:
        center;

    justify-content:
        center;

    padding:
        18px;

    background:
        rgba(0,0,0,.94);

    backdrop-filter:
        blur(10px);
}


.modal.open {

    display:
        flex;
}


/* =====================================================
   MODAL BOX
===================================================== */

.modal-box {

    width:
        min(1100px,100%);

    max-height:
        95vh;

    overflow:
        hidden;

    background:
        #080808;

    border:
        1px solid #292929;

    border-radius:
        12px;

    box-shadow:
        7px 8px 0 #000;
}


/* =====================================================
   MODAL HEADER
===================================================== */

.modal-header {

    min-height:
        58px;

    padding:
        9px 12px 9px 17px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        15px;

    border-bottom:
        1px solid #1d1d1d;
}


.modal-title {

    color:
        #ccc;

    font-size:
        14px;

    font-weight:
        700;

    line-height:
        1.4;
}


.close {

    width:
        37px;

    height:
        37px;

    flex-shrink:
        0;

    border:
        1px solid #292929;

    border-radius:
        10px;

    background:
        #0c0c0c;

    color:
        #666;

    cursor:
        pointer;

    font-size:
        21px;

    transition:
        .2s ease;
}


.close:hover {

    color:
        #ddd;

    background:
        #151515;

    transform:
        rotate(5deg);
}


/* =====================================================
   VIDEO
===================================================== */

.video-container {

    width:
        100%;

    aspect-ratio:
        16 / 9;

    background:
        #000;
}


.video-container iframe {

    width:
        100%;

    height:
        100%;

    display:
        block;

    border:
        0;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:1200px) {

    .grid {

        grid-template-columns:
            repeat(4,minmax(0,1fr));
    }

}


@media (max-width:900px) {

    .grid {

        grid-template-columns:
            repeat(3,minmax(0,1fr));
    }

}


@media (max-width:650px) {

    .header-inner {

        min-height:
            108px;

        padding:
            9px 0;

        flex-wrap:
            wrap;

        gap:
            9px;
    }


    .logo {

        width:
            145px;
    }


    .random-button {

        margin-left:
            auto;
    }


    .search-wrapper {

        order:
            3;

        flex-basis:
            100%;

        max-width:
            none;
    }


    .search {

        height:
            40px;
    }


    .main {

        width:
            94%;

        padding-top:
            28px;
    }


    .heading {

        font-size:
            25px;
    }


    .grid {

        grid-template-columns:
            repeat(2,minmax(0,1fr));

        gap:
            25px 10px;
    }


    .thumbnail {

        border-radius:
            8px;

        box-shadow:
            3px 4px 0 #020202;
    }


    .title {

        padding-top:
            8px;

        font-size:
            12px;
    }


    .play {

        width:
            44px;

        height:
            44px;

        border-radius:
            14px;

        font-size:
            15px;
    }


    .modal {

        padding:
            0;
    }


    .modal-box {

        width:
            100%;

        height:
            100%;

        max-height:

        border-radius:
            0;
    }

}


/* =====================================================
   TOUCH
===================================================== */

@media (hover:none) {

    .play-overlay {

        opacity:
            1;
    }


    .card:hover {

        transform:
            none;
    }


    .card:hover .thumbnail img {

        transform:
            none;

        opacity:
            .88;
    }

}

</style>

</head>

     HEADER

<header class="header">

                alt="Logo"
            >

        </div>


        <!-- SEARCH -->

<!-- =====================================================

<main class="main">

<script>

/* =====================================================
   SETTINGS
===================================================== */


/*
links.csv is in the SAME folder
as this HTML file.
*/

const CSV_URL =
    "./links.csv";


/*
Exactly 30 videos per page.
*/

const VIDEOS_PER_PAGE =
    30;


/* =====================================================
   ELEMENTS
===================================================== */

const grid =
    document.getElementById(
        "grid"
    );

const status =
    document.getElementById(
        "status"
    );

const loader =
    document.getElementById(
        "loader"
    );

const empty =
    document.getElementById(
        "empty"
    );

const pagination =
    document.getElementById(
        "pagination"
    );

const search =
    document.getElementById(
        "search"
    );

const modal =
    document.getElementById(
        "modal"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const videoContainer =
    document.getElementById(
        "videoContainer"
    );

const closeButton =
    document.getElementById(
        "close"
    );

const randomButton =
    document.getElementById(
        "randomButton"
    );


/* =====================================================
   DATA
===================================================== */

let videos = [];

let filteredVideos = [];

let currentPage = 1;


/* =====================================================
   SHUFFLE
===================================================== */


/*
Fisher-Yates shuffle.

This randomizes the entire CSV
every time the page loads.
*/

function shuffle(array) {

    const result =
        [...array];


    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];
    }


    return result;
}


/* =====================================================
   FORMAT TITLE
===================================================== */


/*
Example:

rich-people-are-watching-an-exhibition

becomes:

Rich People Are Watching An Exhibition
*/

function formatTitle(slug) {

    if (!slug) {

        return "Untitled Video";
    }


    let title =
        slug;


    try {

        title =
            decodeURIComponent(
                title
            );

    }

    catch (_) {

        // Ignore malformed
        // encoded text.

    }


    title =
        title
            .replace(
                /[-_]+/g,
                " "
            )
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    title =
        title
            .toLowerCase()
            .split(" ")
            .map(
                word => {

                    if (!word) {

                        return "";
                    }


                    return (
                        word.charAt(0)
                            .toUpperCase()
                        +
                        word.slice(1)
                    );

                }
            )
            .join(" ");


    return (
        title ||
        "Untitled Video"
    );
}


/* =====================================================
   CLEAN URL
===================================================== */

function cleanUrl(rawUrl) {

    let url =
        rawUrl.trim();


    /*
    Remove surrounding quotes.
    */

    if (
        url.length >= 2 &&
        (
            (
                url.startsWith('"') &&
                url.endsWith('"')
            )
            ||
            (
                url.startsWith("'") &&
                url.endsWith("'")
            )
        )
    ) {

        url =
            url.slice(
                1,
                -1
            ).trim();
    }


    /*
    Fix malformed:

    https//example.com

    into:

    https://example.com
    */

    url =
        url.replace(
            /^https\/\//i,
            "https://"
        );


    url =
        url.replace(
            /^http\/\//i,
            "http://"
        );


    return url;
}


/* =====================================================
   THUMBNAIL FOLDER
===================================================== */


/*
Examples:

1     → 0
999   → 0
1000  → 1000
1465  → 1000
1999  → 1000
2000  → 2000
2283  → 2000
3000  → 3000
*/

function getThumbnailFolder(id) {

    const number =
        parseInt(
            id,
            10
        );


    if (
        Number.isNaN(number)
    ) {

        return null;
    }


    return (
        Math.floor(
            number / 1000
        )
        *
        1000
    );
}


/* =====================================================
   CREATE THUMBNAIL
===================================================== */

function createThumbnailUrl(
    url,
    id
) {

    const folder =
        getThumbnailFolder(
            id
        );


    if (
        folder === null
    ) {

        return null;
    }


    return (
        url.origin
        +
        "/contents/videos_screenshots/"
        +
        folder
        +
        "/"
        +
        encodeURIComponent(
            id
        )
        +
        "/264x198/1.jpg"
    );
}


/* =====================================================
   PARSE VIDEO URL
===================================================== */


/*
Input:

https://sick-r.com/videos/2283/
rich-people-are-watching-an-exhibition/

Output:

ID:
2283

Title:
Rich People Are Watching An Exhibition

Embed:

https://sick-r.com/embed/2283

Thumbnail:

https://sick-r.com/contents/videos_screenshots/
2000/2283/264x198/1.jpg
*/

function parseVideoUrl(
    rawUrl
) {

    const cleaned =
        cleanUrl(
            rawUrl
        );


    if (!cleaned) {

        return null;
    }


    let url;


    try {

        url =
            new URL(
                cleaned
            );

    }

    catch (_) {

        console.warn(
            "Invalid URL:",
            cleaned
        );

        return null;
    }


    const parts =
        url.pathname
            .split("/")
            .filter(
                Boolean
            );


    /* =================================================
       /videos/ID/title
    ================================================= */

    const videosIndex =
        parts.findIndex(
            part =>
                part.toLowerCase()
                === "videos"
        );


    if (
        videosIndex !== -1 &&
        parts[
            videosIndex + 1
        ]
    ) {


        const id =
            parts[
                videosIndex + 1
            ];


        const titleSlug =
            parts
                .slice(
                    videosIndex + 2
                )
                .join("-");


        const title =
            formatTitle(
                titleSlug
            );


        const embedUrl =
            url.origin
            +
            "/embed/"
            +
            encodeURIComponent(
                id
            );


        const thumbnailUrl =
            createThumbnailUrl(
                url,
                id
            );


        return {

            id:
                id,

            title:
                title,

            embedUrl:
                embedUrl,

            thumbnailUrl:
                thumbnailUrl,

            sourceUrl:
                url.href
        };
    }


    /* =================================================
       /embed/ID
    ================================================= */

    const embedIndex =
        parts.findIndex(
            part =>
                part.toLowerCase()
                === "embed"
        );


    if (
        embedIndex !== -1 &&
        parts[
            embedIndex + 1
        ]
    ) {


        const id =
            parts[
                embedIndex + 1
            ];


        return {

            id:
                id,

            title:
                "Video",

            embedUrl:
                url.href,

            thumbnailUrl:
                createThumbnailUrl(
                    url,
                    id
                ),

            sourceUrl:
                url.href
        };
    }


    return null;
}


/* =====================================================
   PARSE CSV
===================================================== */


/*
One URL per line.

No columns required.
*/

function parseCSV(text) {

    return text

        .split(
            /\r?\n/
        )

        .map(
            line =>
                line.trim()
        )

        .filter(
            line =>
                line.length > 0
        );
}


/* =====================================================
   LOAD CSV
===================================================== */

async function loadVideos() {

    try {

        status.textContent =
            "Loading video list...";


        const response =
            await fetch(
                CSV_URL,
                {
                    cache:
                        "no-cache"
                }
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const text =
            await response.text();


        const urls =
            parseCSV(
                text
            );


        const results =
            [];

        const seen =
            new Set();


        /*
        Parse every URL.
        */

        for (
            const rawUrl
            of urls
        ) {


            const video =
                parseVideoUrl(
                    rawUrl
                );


            if (!video) {

                continue;
            }


            /*
            Prevent duplicates.
            */

            if (
                seen.has(
                    video.embedUrl
                )
            ) {

                continue;
            }


            seen.add(
                video.embedUrl
            );


            results.push(
                video
            );
        }


        /*
        =================================================
        IMPORTANT

        Shuffle the entire archive
        every time the page loads.
        =================================================
        */

        videos =
            shuffle(
                results
            );


        filteredVideos =
            [...videos];


        loader.style.display =
            "none";


        status.textContent =
            `${videos.length.toLocaleString()} videos available`;


        render();


    }

    catch (error) {

        console.error(
            "CSV ERROR:",
            error
        );


        loader.style.display =
            "none";


        status.textContent =
            "Could not load links.csv";


        empty.textContent =
            "Could not load links.csv. Make sure it is in the same folder as this page.";


        empty.style.display =
            "block";
    }
}


/* =====================================================
   RENDER
===================================================== */

function render() {

    grid.innerHTML =
        "";

    pagination.innerHTML =
        "";


    if (
        filteredVideos.length === 0
    ) {

        empty.style.display =
            "block";

        return;
    }


    empty.style.display =
        "none";


    const totalPages =
        Math.ceil(
            filteredVideos.length /
            VIDEOS_PER_PAGE
        );


    if (
        currentPage > totalPages
    ) {

        currentPage =
            totalPages;
    }


    /*
    Only render the current
    30 videos.

    This is important when
    the CSV contains hundreds
    of thousands of links.
    */

    const start =
        (
            currentPage - 1
        )
        *
        VIDEOS_PER_PAGE;


    const pageVideos =
        filteredVideos.slice(
            start,
            start + VIDEOS_PER_PAGE
        );


    const fragment =
        document.createDocumentFragment();


    pageVideos.forEach(
        video => {

            fragment.appendChild(
                createCard(
                    video
                )
            );

        }
    );


    grid.appendChild(
        fragment
    );


    renderPagination(
        totalPages
    );
}


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(video) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "card";


    /* =================================================
       THUMBNAIL
    ================================================= */

    const thumbnail =
        document.createElement(
            "div"
        );


    thumbnail.className =
        "thumbnail";


    /*
    Thumbnail image.
    */

    if (
        video.thumbnailUrl
    ) {


        const img =
            document.createElement(
                "img"
            );


        img.src =
            video.thumbnailUrl;


        img.alt =
            video.title;


        /*
        Lazy loading means only
        thumbnails near the viewport
        are requested.
        */

        img.loading =
            "lazy";


        /*
        If 1.jpg doesn't exist,
        simply remove it.
        */

        img.onerror =
            function() {

                this.remove();

            };


        thumbnail.appendChild(
            img
        );
    }


    /* =================================================
       PLAY OVERLAY
    ================================================= */

    const overlay =
        document.createElement(
            "div"
        );


    overlay.className =
        "play-overlay";


    const play =
        document.createElement(
            "div"
        );


    play.className =
        "play";


    play.textContent =
        "▶";


    overlay.appendChild(
        play
    );


    thumbnail.appendChild(
        overlay
    );


    /* =================================================
       TITLE
    ================================================= */

    const title =
        document.createElement(
            "div"
        );


    title.className =
        "title";


    title.textContent =
        video.title;


    /* =================================================
       CARD
    ================================================= */

    card.appendChild(
        thumbnail
    );


    card.appendChild(
        title
    );


    card.addEventListener(
        "click",
        function() {

            openVideo(
                video
            );

        }
    );


    return card;
}


/* =====================================================
   PAGINATION
===================================================== */

function renderPagination(
    totalPages
) {

    if (
        totalPages <= 1
    ) {

        return;
    }


    /*
    Previous.
    */

    const previous =
        document.createElement(
            "button"
        );


    previous.className =
        "page-button";


    previous.textContent =
        "‹";


    previous.disabled =
        currentPage === 1;


    previous.onclick =
        function() {

            currentPage--;

            render();

            scrollTop();

        };


    pagination.appendChild(
        previous
    );


    /*
    Determine page range.
    */

    let start =
        Math.max(
            1,
            currentPage - 2
        );


    let end =
        Math.min(
            totalPages,
            currentPage + 2
        );


    /*
    Page numbers.
    */

    for (
        let page = start;
        page <= end;
        page++
    ) {


        const button =
            document.createElement(
                "button"
            );


        button.className =
            "page-button";


        button.textContent =
            page;


        if (
            page === currentPage
        ) {

            button.classList.add(
                "active"
            );
        }


        button.onclick =
            function() {

                currentPage =
                    page;

                render();

                scrollTop();

            };


        pagination.appendChild(
            button
        );
    }


    /*
    Next.
    */

    const next =
        document.createElement(
            "button"
        );


    next.className =
        "page-button";


    next.textContent =
        "›";


    next.disabled =
        currentPage === totalPages;


    next.onclick =
        function() {

            currentPage++;

            render();

            scrollTop();

        };


    pagination.appendChild(
        next
    );
}


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
    "input",
    function() {

        const query =
            this.value
                .trim()
                .toLowerCase();


        if (!query) {

            filteredVideos =
                [...videos];

        }

        else {

            filteredVideos =
                videos.filter(
                    video =>
                        video.title
                            .toLowerCase()
                            .includes(
                                query
                            )
                );
        }


        currentPage =
            1;


        status.textContent =
            `${filteredVideos.length.toLocaleString()} videos`;


        render();
    }
);


/* =====================================================
   RANDOM VIDEO
===================================================== */

randomButton.addEventListener(
    "click",
    function() {

        if (
            videos.length === 0
        ) {

            return;
        }


        const randomIndex =
            Math.floor(
                Math.random() *
                videos.length
            );


        openVideo(
            videos[
                randomIndex
            ]
        );
    }
);


/* =====================================================
   OPEN VIDEO
===================================================== */

function openVideo(video) {

    modalTitle.textContent =
        video.title;


    /*
    Remove previous player.
    */

    videoContainer.innerHTML =
        "";


    /*
    Create iframe only when
    the visitor actually opens
    the video.
    */

    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.src =
        video.embedUrl;


    iframe.setAttribute(
        "allowfullscreen",
        ""
    );


    iframe.setAttribute(
        "allow",
        "autoplay; fullscreen; picture-in-picture; encrypted-media"
    );


    iframe.setAttribute(
        "referrerpolicy",
        "strict-origin-when-cross-origin"
    );


    videoContainer.appendChild(
        iframe
    );


    modal.classList.add(
        "open"
    );


    document.body.style.overflow =
        "hidden";
}


/* =====================================================
   CLOSE VIDEO
===================================================== */

function closeVideo() {

    /*
    Destroy iframe so the video
    stops completely.
    */

    videoContainer.innerHTML =
        "";


    modal.classList.remove(
        "open"
    );


    document.body.style.overflow =
        "";
}


/* =====================================================
   CLOSE BUTTON
===================================================== */

closeButton.addEventListener(
    "click",
    closeVideo
);


/* =====================================================
   CLICK OUTSIDE
===================================================== */

modal.addEventListener(
    "click",
    function(event) {

        if (
            event.target === modal
        ) {

            closeVideo();
        }
    }
);


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            modal.classList.contains(
                "open"
            )
        ) {

            closeVideo();
        }
    }
);


/* =====================================================
   SCROLL TOP
===================================================== */

function scrollTop() {

    window.scrollTo({

        top:
            0,

        behavior:
            "smooth"
    });
}


/* =====================================================
   START
===================================================== */

loadVideos();

</script>
