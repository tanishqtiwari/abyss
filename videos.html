<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="description" content="Sick Fetish video archive">
<title>Sick Fetish</title>

<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
    margin: 0;
    min-height: 100vh;
    padding-bottom: 70px;
    background: radial-gradient(circle at 10% 5%, rgba(255,255,255,.018), transparent 24%), radial-gradient(circle at 90% 80%, rgba(255,255,255,.012), transparent 26%), #050505;
    color: #dddddd;
    font-family: Arial, Helvetica, sans-serif;
}

:root {
    --bg: #050505;
    --surface: #0b0b0b;
    --surface-2: #111111;
    --border: #242424;
    --border-light: #2d2d2d;
    --text: #dddddd;
    --text-bright: #eeeeee;
    --muted: #666666;
    --muted-dark: #454545;
}

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(5,5,5,.95);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-bottom: 1px solid #171717;
}

.header-inner {
    width: min(1400px,94%);
    min-height: 76px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 24px;
}

.logo {
    width: 190px;
    aspect-ratio: 1600 / 380;
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    transition: transform .2s ease;
}

.logo:hover img { transform: scale(1.025); }

.search-form-wrapper {
    position: relative;
    flex: 1;
    max-width: 620px;
    margin: auto;
    display: flex;
    align-items: center;
}

.search-wrapper {
    position: relative;
    flex: 1;
}

.search {
    width: 100%;
    height: 43px;
    padding: 0 44px 0 17px;
    background: #090909;
    color: #dddddd;
    border: 1px solid #242424;
    border-radius: 11px 0 0 11px;
    outline: none;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    box-shadow: 3px 3px 0 #020202;
    transition: border-color .2s ease, background .2s ease;
}

.search::placeholder { color: #444444; }
.search:focus { border-color: #3b3b3b; background: #0d0d0d; }

.search-submit {
    height: 43px;
    padding: 0 18px;
    background: #141414;
    color: #aaaaaa;
    border: 1px solid #242424;
    border-left: 0;
    border-radius: 0 11px 11px 0;
    cursor: pointer;
    font-size: 14px;
    box-shadow: 3px 3px 0 #020202;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
}

.search-submit:hover { background: #1c1c1c; color: #ffffff; border-color: #3b3b3b; }

.search-suggestions {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: #0a0a0a;
    border: 1px solid #242424;
    border-radius: 11px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    z-index: 150;
    display: none;
    max-height: 360px;
    overflow-y: auto;
}

.search-suggestions.open { display: block; }

.suggestion-item {
    padding: 11px 16px;
    font-size: 13px;
    color: #cccccc;
    cursor: pointer;
    border-bottom: 1px solid #141414;
    transition: background .15s ease, color .15s ease;
    display: flex;
    align-items: center;
    gap: 10px;
}

.suggestion-item:last-child { border-bottom: 0; }
.suggestion-item:hover, .suggestion-item.highlighted { background: #161616; color: #ffffff; }

.search-cancel {
    position: absolute;
    right: 7px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: #555555;
    cursor: pointer;
    font-size: 20px;
    line-height: 30px;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background .15s ease, color .15s ease;
}

.search-form-wrapper.has-text .search-cancel { display: flex; }
.search-cancel:hover { background: #191919; color: #dddddd; }

.random-button {
    width: 43px;
    height: 43px;
    flex-shrink: 0;
    border: 1px solid #292929;
    border-radius: 11px;
    background: #0b0b0b;
    color: #666666;
    cursor: pointer;
    font-size: 21px;
    box-shadow: 3px 3px 0 #020202;
    transition: .2s ease;
}

.random-button:hover { color: #dddddd; background: #111111; transform: rotate(8deg) translateY(-2px); }

.main {
    width: min(1400px,94%);
    margin: auto;
    padding: 36px 0 0;
}

.top-bar { margin-bottom: 29px; }
.heading { margin: 0; color: #e1e1e1; font-size: 29px; font-weight: 700; letter-spacing: -.6px; line-height: 1.1; }
.status { margin-top: 9px; color: #484848; font-size: 11px; }

.loader {
    width: 31px;
    height: 31px;
    margin: 55px auto;
    border: 3px solid #272727;
    border-top-color: #b0b0b0;
    border-radius: 50%;
    animation: spin .75s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.grid {
    display: grid;
    grid-template-columns: repeat(5,minmax(0,1fr));
    gap: 30px 17px;
}

.card {
    min-width: 0;
    cursor: pointer;
    transition: transform .2s ease;
    text-decoration: none;
    display: block;
}

.card:nth-child(4n+1) { transform: rotate(-.3deg); }
.card:nth-child(4n+2) { transform: rotate(.2deg); }
.card:nth-child(4n+3) { transform: rotate(-.15deg); }
.card:nth-child(4n) { transform: rotate(.25deg); }
.card:hover { transform: translateY(-5px) rotate(0deg); }

.thumbnail {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: linear-gradient(135deg, #151515, #070707);
    border: 1px solid #222222;
    border-radius: 10px;
    box-shadow: 4px 5px 0 #020202;
    transition: border-color .2s ease, box-shadow .2s ease;
}

.card:hover .thumbnail { border-color: #353535; box-shadow: 5px 7px 0 #010101; }

.thumbnail img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    opacity: .9;
    transition: transform .4s ease, opacity .25s ease, filter .25s ease;
}

.card:hover .thumbnail img { transform: scale(1.055); opacity: .72; filter: brightness(.8); }

.title {
    padding: 10px 2px 0;
    color: #cfcfcf;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: color .2s ease;
}

.card:hover .title { color: #eeeeee; }

.pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px;
    margin: 58px 0 20px;
}

.page-button {
    min-width: 39px;
    height: 39px;
    padding: 0 10px;
    border: 1px solid #242424;
    border-radius: 10px;
    background: #090909;
    color: #555555;
    cursor: pointer;
    font-size: 12px;
    box-shadow: 2px 3px 0 #020202;
    transition: .18s ease;
}

.page-button:hover { color: #cccccc; background: #111111; transform: translateY(-2px); }
.page-button.active { color: #111111; background: #dddddd; border-color: #dddddd; font-weight: 700; transform: rotate(-3deg); box-shadow: 3px 4px 0 #000000; }
.page-button:disabled { opacity: .2; cursor: default; transform: none; }

.empty { display: none; padding: 100px 20px; text-align: center; color: #444444; font-size: 13px; }

@media (max-width:1200px) { .grid { grid-template-columns: repeat(4,minmax(0,1fr)); } }
@media (max-width:900px) { .grid { grid-template-columns: repeat(3,minmax(0,1fr)); } }
@media (max-width:650px) {
    .grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
    .search-form-wrapper { order: 3; flex-basis: 100%; }
}
@media (max-width:380px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div id="logo" class="logo" title="Home" role="button" tabindex="0">
            <img src="https://firebasestorage.googleapis.com/v0/b/counter-ea7c8.firebasestorage.app/o/sf%2F10c2d1be-e912-4443-be9a-0341e2f98808.jpeg?alt=media&token=2b4a2e40-1e85-4d36-b00d-bd910f120d0f" alt="Sick Fetish">
        </div>

        <form id="searchForm" class="search-form-wrapper" onsubmit="return false;">
            <div id="searchWrapper" class="search-wrapper">
                <input id="search" class="search" type="search" placeholder="Search videos..." autocomplete="off" aria-label="Search videos" role="combobox" aria-expanded="false" aria-controls="searchSuggestions">
                <button id="searchCancel" class="search-cancel" type="button" aria-label="Cancel search" title="Clear search">×</button>
                <div id="searchSuggestions" class="search-suggestions" role="listbox"></div>
            </div>
            <button id="searchSubmit" class="search-submit" type="submit" aria-label="Submit search" title="Search">🔍</button>
        </form>

        <button id="randomButton" class="random-button" type="button" aria-label="Random video" title="Random video">⤨</button>
    </div>
</header>

<main class="main">
    <div class="top-bar">
        <h1 id="heading" class="heading">Latest Videos</h1>
        <div id="status" class="status">Loading videos...</div>
    </div>

    <div id="loader" class="loader"></div>
    <section id="grid" class="grid"></section>
    <div id="empty" class="empty">No videos found.</div>
    <nav id="pagination" class="pagination" aria-label="Video pages"></nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
<script>
const CSV_URL = "./links.csv";
const VIDEOS_PER_PAGE = 30;

const grid = document.getElementById("grid");
const status = document.getElementById("status");
const loader = document.getElementById("loader");
const empty = document.getElementById("empty");
const pagination = document.getElementById("pagination");
const searchForm = document.getElementById("searchForm");
const search = document.getElementById("search");
const searchFormWrapper = document.getElementById("searchFormWrapper");
const searchCancel = document.getElementById("searchCancel");
const searchSuggestions = document.getElementById("searchSuggestions");
const heading = document.getElementById("heading");
const logo = document.getElementById("logo");
const randomButton = document.getElementById("randomButton");

let videos = [];
let filteredVideos = [];
let currentPage = 1;
let fuseInstance = null;

function shuffle(array) {
    const res = [...array];
    for (let i = res.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [res[i], res[j]] = [res[j], res[i]];
    }
    return res;
}

function searchVideos(query, allVideos) {
    const cleanQuery = query.trim();
    if (!cleanQuery) return shuffle(allVideos);

    if (!fuseInstance) return allVideos;

    const results = fuseInstance.search(cleanQuery);
    return results.sort((a, b) => a.score - b.score).map(r => r.item);
}

function formatTitle(slug) {
    if (!slug) return "Untitled Video";
    let title = slug;
    try { title = decodeURIComponent(title); } catch (_) {}
    return title.replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim().toLowerCase()
        .split(" ").map(w => w ? w.charAt(0).toUpperCase() + w.slice(1) : "").join(" ") || "Untitled Video";
}

function cleanUrl(rawUrl) {
    let url = String(rawUrl || "").trim();
    if (url.length >= 2 && ((url.startsWith('"') && url.endsWith('"')) || (url.startsWith("'") && url.endsWith("'")))) {
        url = url.slice(1, -1).trim();
    }
    return url.replace(/^https\/\//i, "https://").replace(/^http\/\//i, "http://");
}

function createThumbnailUrl(url, id) {
    const hostname = url.hostname.toLowerCase();
    const isPervertDomain = hostname.includes('pervertium.com') || hostname.includes('perverttube.com');
    const folder = Math.floor(parseInt(id, 10) / 1000) * 1000;

    if (isPervertDomain) {
        // Output format: https://www.perverttube.com/contents/videos_screenshots/86000/86719/preview.jpg
        return `${url.origin}/contents/videos_screenshots/${folder}/${encodeURIComponent(id)}/preview.jpg`;
    }

    // Default tube script structure with 264x198 dimension subfolder
    return `${url.origin}/contents/videos_screenshots/${folder}/${encodeURIComponent(id)}/264x198/1.jpg`;
}

function parseVideoUrl(rawUrl) {
    const cleaned = cleanUrl(rawUrl);
    if (!cleaned) return null;
    let url;
    try { url = new URL(cleaned); } catch (_) { return null; }
    const parts = url.pathname.split("/").filter(Boolean);

    // Support both /videos/ID/title AND /video/ID/title
    const vIdx = parts.findIndex(p => {
        const lower = p.toLowerCase();
        return lower === "videos" || lower === "video";
    });

    if (vIdx !== -1 && parts[vIdx + 1]) {
        const id = parts[vIdx + 1];
        const titleSlug = parts.slice(vIdx + 2).join("-");
        const title = formatTitle(titleSlug);
        const embedUrl = url.origin + "/embed/" + encodeURIComponent(id);
        const thumbnailUrl = createThumbnailUrl(url, id);
        return { id, title, embedUrl, thumbnailUrl, sourceUrl: url.href };
    }
    return null;
}

async function loadVideos() {
    try {
        status.textContent = "Loading video list...";
        const response = await fetch(CSV_URL, { method: "GET", cache: "no-cache" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const text = await response.text();
        const urls = text.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

        const results = [];
        const seen = new Set();
        for (const rawUrl of urls) {
            const video = parseVideoUrl(rawUrl);
            if (video && !seen.has(video.embedUrl)) {
                seen.add(video.embedUrl);
                results.push(video);
            }
        }

        videos = results;
        filteredVideos = shuffle(videos);

        fuseInstance = new Fuse(videos, {
            keys: [
                { name: 'title', weight: 0.8 },
                { name: 'id', weight: 0.2 }
            ],
            includeScore: true,
            threshold: 0.2,
            distance: 100,
            minMatchCharLength: 2,
            ignoreLocation: true
        });

        loader.style.display = "none";
        status.textContent = `${videos.length} videos loaded`;
        renderGrid();
        renderPagination();
    } catch (err) {
        loader.style.display = "none";
        status.textContent = "Failed to load video list.";
        empty.style.display = "block";
    }
}

function renderGrid() {
    grid.innerHTML = "";
    const startIndex = (currentPage - 1) * VIDEOS_PER_PAGE;
    const pageVideos = filteredVideos.slice(startIndex, startIndex + VIDEOS_PER_PAGE);

    if (pageVideos.length === 0) {
        empty.style.display = "block";
        return;
    }
    empty.style.display = "none";

    pageVideos.forEach(video => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = `second.html?id=${encodeURIComponent(video.id)}`;

        const thumb = document.createElement("div");
        thumb.className = "thumbnail";
        if (video.thumbnailUrl) {
            const img = document.createElement("img");
            img.src = video.thumbnailUrl;
            img.alt = video.title;
            img.loading = "lazy";
            thumb.appendChild(img);
        }

        const titleDiv = document.createElement("div");
        titleDiv.className = "title";
        titleDiv.textContent = video.title;

        a.appendChild(thumb);
        a.appendChild(titleDiv);
        grid.appendChild(a);
    });
}

function renderPagination() {
    pagination.innerHTML = "";
    const totalPages = Math.ceil(filteredVideos.length / VIDEOS_PER_PAGE);
    if (totalPages <= 1) return;

    for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
            const btn = document.createElement("button");
            btn.className = "page-button" + (i === currentPage ? " active" : "");
            btn.textContent = i;
            btn.addEventListener("click", () => {
                currentPage = i;
                renderGrid();
                renderPagination();
                window.scrollTo({ top: 0, behavior: "smooth" });
            });
            pagination.appendChild(btn);
        }
    }
}

function executeSearch(query) {
    searchSuggestions.classList.remove("open");
    currentPage = 1;
    filteredVideos = searchVideos(query, videos);
    renderGrid();
    renderPagination();
    heading.textContent = query.trim() ? `Search: "${query.trim()}"` : "Latest Videos";
    status.textContent = `${filteredVideos.length} videos found`;
}

search.addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    searchFormWrapper.classList.toggle("has-text", q.length > 0);
    if (!q) { searchSuggestions.classList.remove("open"); return; }
    
    const matches = videos.filter(v => v.title.toLowerCase().includes(q)).slice(0, 6);
    if (!matches.length) { searchSuggestions.classList.remove("open"); return; }

    searchSuggestions.innerHTML = "";
    matches.forEach(video => {
        const item = document.createElement("div");
        item.className = "suggestion-item";
        item.innerHTML = `🔍 <span>${video.title}</span>`;
        item.addEventListener("mousedown", (e) => {
            e.preventDefault();
            search.value = video.title;
            executeSearch(video.title);
        });
        searchSuggestions.appendChild(item);
    });
    searchSuggestions.classList.add("open");
});

searchForm.addEventListener("submit", (e) => {
    e.preventDefault();
    executeSearch(search.value);
});

searchCancel.addEventListener("click", () => {
    search.value = "";
    searchFormWrapper.classList.remove("has-text");
    searchSuggestions.classList.remove("open");
    executeSearch("");
});

randomButton.addEventListener("click", () => {
    if (videos.length === 0) return;
    const randomVideo = videos[Math.floor(Math.random() * videos.length)];
    window.location.href = `second.html?id=${encodeURIComponent(randomVideo.id)}`;
});

logo.addEventListener("click", () => { window.location.href = "videos.html"; });

loadVideos();
</script>

</body>
</html>
