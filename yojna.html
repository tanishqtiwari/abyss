<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LADLI RANDI YOJNA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    :root {
        --blood: #ff1a1a;
        --dark: #0a0000;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #050000;
        color: var(--blood);
        font-family: 'Courier New', monospace;
        min-height: 100vh;
    }

    /* Top AppBar */
    .appbar {
        background: #1a0000;
        border-bottom: 3px solid var(--blood);
        padding: 12px 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 4px 15px rgba(255, 26, 26, 0.3);
    }

    .appbar-title {
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 2px;
        color: #ff6666;
    }

    #adminBtn {
        background: transparent;
        color: var(--blood);
        border: 2px solid var(--blood);
        padding: 8px 16px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        white-space: nowrap;
    }

    #adminBtn:hover {
        background: var(--blood);
        color: black;
    }

    /* Main Header */
    .main-header {
        text-align: center;
        padding: 25px 15px 20px;
        background: linear-gradient(#1f0000, #0a0000);
        border-bottom: 2px solid #440000;
    }

    .main-header h1 {
        font-size: 38px;
        font-weight: bold;
        letter-spacing: 6px;
        text-transform: uppercase;
        color: var(--blood);
        text-shadow: 
            0 0 15px #ff1a1a,
            0 0 35px #cc0000;
        margin: 0;
        animation: subtle-flicker 4s infinite alternate;
    }

    @keyframes subtle-flicker {
        0%, 100% { opacity: 0.98; }
        50% { opacity: 1; }
    }

    .container {
        width: 92%;
        max-width: 380px;
        margin: 25px auto;
        padding: 20px;
        background: rgba(15, 0, 0, 0.95);
        border: 2px solid var(--blood);
        box-shadow: 0 0 25px rgba(255, 26, 26, 0.25);
    }

    input[type="text"], 
    input[type="file"] {
        width: 100%;
        padding: 14px;
        margin: 12px 0;
        background: #0f0000;
        border: 1px solid var(--blood);
        color: var(--blood);
        font-family: monospace;
        font-size: 16px;
    }

    button#mainSubmit {
        width: 100%;
        padding: 16px;
        margin-top: 10px;
        background: #220000;
        border: 2px solid var(--blood);
        color: var(--blood);
        font-size: 17px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.4s;
    }

    button#mainSubmit:hover {
        background: var(--blood);
        color: black;
    }

    h3 {
        text-align: center;
        margin: 35px 0 15px;
        color: #dd4444;
        letter-spacing: 3px;
        font-size: 18px;
    }

    /* Improved Card - Full Image Display */
    .card {
        width: 92%;
        max-width: 380px;
        margin: 20px auto;
        padding: 15px;
        background: rgba(10, 0, 0, 0.95);
        border: 2px solid var(--blood);
        box-shadow: 0 0 20px rgba(255, 26, 26, 0.3);
    }

    .image-container {
        width: 100%;
        background: #000;
        border: 1px solid #550000;
        padding: 8px;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 280px;
        max-height: 380px;
        overflow: hidden;
    }

    .card img {
        width: 100%;
        height: auto;
        max-height: 360px;
        object-fit: contain;        /* This ensures full image is shown without cropping */
        display: block;
        background: #000;
    }

    .card h3 {
        text-align: center;
        margin-top: 10px;
        color: var(--blood);
        text-shadow: 0 0 8px var(--blood);
        font-size: 18px;
    }

    .hidden { display: none !important; }

    .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(circle at center, transparent 40%, rgba(5,0,0,0.85) 100%);
        z-index: 999;
    }
</style>
</head>

<body>

    <!-- Top AppBar -->
    <div class="appbar">
        <div class="appbar-title">WElCOME</div>
        <button id="adminBtn" onclick="showAdmin()">ADMIN ACCESS</button>
    </div>

    <!-- Main Title -->
    <div class="main-header">
        <h1>लाडली रंडी योजना</h1>
    </div>

    <!-- User Section -->
    <div id="userSection">
        <div class="container">
            <form id="uploadForm">
                <input type="text" id="name" placeholder="ENTER YOUR NAME" required>
                <input type="file" id="photo" accept="image/*" required>
                <button id="mainSubmit" type="submit">SUBMIT OFFERING</button>
            </form>
        </div>

        <h3>● THE CHOSEN SISTERS ●</h3>
        <div id="list"></div>
    </div>

    <!-- Admin Section -->
    <div id="adminSection" class="hidden">
        <button onclick="goBack()" style="margin:15px 20px; padding:10px 18px; background:#220000; border:2px solid #660000; color:#ff8888;">
            ← BACK
        </button>

        <div id="loginBox" style="max-width:380px; margin:30px auto; padding:25px; border:2px solid var(--blood); background:rgba(15,0,0,0.95);">
            <h3 style="text-align:center; margin-bottom:20px;">ADMIN PROTOCOL</h3>
            <input id="username" placeholder="USERNAME" style="margin-bottom:12px;">
            <input id="password" type="password" placeholder="PASSWORD">
            <button onclick="login()" style="margin-top:20px; width:100%;">UNLOCK ACCESS</button>
        </div>

        <div id="adminPanel" class="hidden">
            <h3 style="text-align:center;">PENDING OFFERINGS</h3>
            <div id="adminList"></div>
        </div>
    </div>

    <div class="vignette"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
    getFirestore, collection, addDoc, onSnapshot,
    query, where, updateDoc, doc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyB_rZQ0-PTcw2u--0AjybYOBtWnoh2XxDk",
  authDomain: "counter-ea7c8.firebaseapp.com",
  projectId: "counter-ea7c8",
  storageBucket: "counter-ea7c8.firebasestorage.app",
  messagingSenderId: "976604631332",
  appId: "1:976604631332:web:fc0929d3231ac63a67a3b1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const colRef = collection(db, "ladli_behna_entries");

const list = document.getElementById("list");
const adminList = document.getElementById("adminList");
const submitBtn = document.getElementById("mainSubmit");

const ADMIN_USER = "zap";
const ADMIN_PASS = "sss";

window.showAdmin = () => {
    document.getElementById("userSection").classList.add("hidden");
    document.getElementById("adminSection").classList.remove("hidden");
};

window.goBack = () => {
    document.getElementById("adminSection").classList.add("hidden");
    document.getElementById("userSection").classList.remove("hidden");
};

/* Form Submit */
document.getElementById("uploadForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const file = document.getElementById("photo").files[0];

    if (!name || !file) return;

    submitBtn.innerText = "PROCESSING...";
    submitBtn.disabled = true;

    try {
        const storageRef = ref(storage, `ladli/${Date.now()}_${file.name}`);
        await uploadBytes(storageRef, file);
        const url = await getDownloadURL(storageRef);

        await addDoc(colRef, {
            name,
            photo: url,
            time: Date.now(),
            status: "pending"
        });

        document.getElementById("uploadForm").reset();
        alert("Offering received...");
    } catch (err) {
        alert("Failed to submit offering.");
    }

    submitBtn.innerText = "SUBMIT OFFERING";
    submitBtn.disabled = false;
});

/* Approved List - Full Image */
const approvedQuery = query(colRef, where("status", "==", "approved"));
onSnapshot(approvedQuery, (snapshot) => {
    list.innerHTML = "";
    snapshot.forEach(docSnap => {
        const d = docSnap.data();
        list.innerHTML += `
            <div class="card">
                <div class="image-container">
                    <img src="${d.photo}" alt="${d.name}">
                </div>
                <h3>${d.name}</h3>
            </div>
        `;
    });
});

/* Admin Login */
window.login = () => {
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;

    if (u === ADMIN_USER && p === ADMIN_PASS) {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        loadPending();
    } else {
        alert("ACCESS DENIED");
    }
};

function loadPending() {
    const q = query(colRef, where("status", "==", "pending"));
    onSnapshot(q, (snapshot) => {
        adminList.innerHTML = "";
        snapshot.forEach(docSnap => {
            const d = docSnap.data();
            const id = docSnap.id;
            adminList.innerHTML += `
                <div class="card">
                    <div class="image-container">
                        <img src="${d.photo}" alt="${d.name}">
                    </div>
                    <h3>${d.name}</h3>
                    <div style="display:flex; gap:8px; margin-top:10px;">
                        <button onclick="approve('${id}')" style="flex:1; background:#002200; border-color:#00aa00; padding:12px;">APPROVE</button>
                        <button onclick="reject('${id}')" style="flex:1; background:#330000; border-color:#ff3333; padding:12px;">REJECT</button>
                    </div>
                </div>
            `;
        });
    });
}

window.approve = async (id) => {
    await updateDoc(doc(db, "ladli_behna_entries", id), { status: "approved" });
};

window.reject = async (id) => {
    await updateDoc(doc(db, "ladli_behna_entries", id), { status: "rejected" });
};
</script>

</body>
</html>
